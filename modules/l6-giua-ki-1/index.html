<script>
/* ================= LỚP 6 · Kết nối tri thức với cuộc sống · đến tuần 9 ================= */
const HANG6=["đơn vị","chục","trăm","nghìn","chục nghìn","trăm nghìn","triệu"];
function dg(n){return String(n).split("").map(Number)}
function uPos(r,U,n,minP){const d=dg(n).reverse(),c=[];d.forEach((x,p)=>{if(p>=minP&&x>0&&d.filter(y=>y===x).length===1)c.push(p)});return c.length?U.pick(r,c):-1}
function rnum(r,U,len,z){let s=String(U.ri(r,1,9));for(let i=1;i<len;i++)s+=r()<z?"0":String(U.ri(r,0,9));return +s}
const gcd=(a,b)=>b?gcd(b,a%b):a, lcm=(a,b)=>a/gcd(a,b)*b;
const setStr=a=>"{"+a.join("; ")+"}";
function fac(e){return [2,3,5,7].filter(p=>e[p]>0).map(p=>e[p]>1?`${p}<sup>${e[p]}</sup>`:`${p}`).join(" · ")}
const val=e=>[2,3,5,7].reduce((m,p)=>m*p**(e[p]||0),1);

const APP={
  key:"gk1-l6-v1", grade:6,
  examText:"Ôn thi giữa học kì I · Kết nối tri thức",
  footer:"Câu hỏi và các văn bản đọc hiểu mới do trang tự soạn theo chương trình sách Kết nối tri thức với cuộc sống, phạm vi đến tuần 9. Đây là trang ôn tập cá nhân. Kết quả được lưu trên máy này.",
  gen:{
    /* ---------- Toán 6 ---------- */
    setcount(r,U){const a=U.ri(r,2,15),b=a+U.ri(r,4,15),v=U.ri(r,0,3);
      if(v===3)return {q:`Tập hợp A = {x ∈ ℕ* | x ≤ ${b}} có bao nhiêu phần tử? ___`,ans:String(b),x:`ℕ* là tập số tự nhiên khác 0: A = {1; 2; …; ${b}} có ${b} phần tử.`};
      const c=[`${a} ≤ x ≤ ${b}`,`${a} < x < ${b}`,`${a} ≤ x < ${b}`][v], n=[b-a+1,b-a-1,b-a][v], lo=v===1?a+1:a, hi=v===0?b:b-1;
      return {q:`Tập hợp A = {x ∈ ℕ | ${c}} có bao nhiêu phần tử? ___`,ans:String(n),x:`A = {${lo}; ${lo+1}; …; ${hi}}, số phần tử là ${hi} − ${lo} + 1 = ${n}.`}},
    setlist(r,U){const n=U.ri(r,3,6), rg=(s,e)=>{const a=[];for(let i=s;i<=e;i++)a.push(i);return a};
      if(r()<.5)return {q:`Tập hợp A = {x ∈ ℕ | x < ${n}} được viết bằng cách liệt kê là:`,o:[setStr(rg(0,n-1)),setStr(rg(1,n-1)),setStr(rg(0,n)),setStr(rg(1,n))],x:`Các số tự nhiên nhỏ hơn ${n} là 0, 1, …, ${n-1} (có cả số 0).`};
      return {q:`Tập hợp B = {x ∈ ℕ* | x ≤ ${n}} được viết bằng cách liệt kê là:`,o:[setStr(rg(1,n)),setStr(rg(0,n)),setStr(rg(1,n-1)),setStr(rg(0,n-1))],x:`ℕ* không chứa số 0; x ≤ ${n} nên lấy cả ${n}.`}},
    roman(r,U){const n=U.ri(r,1,30);
      if(r()<.5){const c=U.shuffle(r,[n-1,n+1,n+4,n-4,n+5,n-5,n+10,n-10].filter(x=>x>=1&&x<=30&&x!==n)).slice(0,3);
        return {q:`Số ${n} viết bằng số La Mã là:`,o:[U.roman(n),...c.map(U.roman)],x:`I = 1, V = 5, X = 10. ${n} = ${U.roman(n)}.`}}
      return {q:`Số La Mã ${U.roman(n)} có giá trị là: ___`,ans:String(n),x:`I = 1, V = 5, X = 10; chữ số nhỏ đứng trước chữ số lớn thì trừ (IV = 4, IX = 9). ${U.roman(n)} = ${n}.`}},
    digitvalue(r,U){let n,p=-1;while(p<0){n=rnum(r,U,U.ri(r,4,7),.2);p=uPos(r,U,n,1)}const d=dg(n).reverse()[p],v=d*10**p;
      return {q:`Trong số ${U.fmt(n)}, chữ số ${d} có giá trị là: ___`,ans:String(v),x:`Chữ số ${d} ở hàng ${HANG6[p]} nên có giá trị ${U.fmt(v)}.`}},
    between(r,U){const a=U.ri(r,5,60),b=a+U.ri(r,3,20);
      if(r()<.5)return {q:`Có bao nhiêu số tự nhiên x thỏa mãn ${a} < x < ${b}? ___`,ans:String(b-a-1),x:`x nhận các giá trị từ ${a+1} đến ${b-1}: có ${b-1} − ${a+1} + 1 = ${b-a-1} số.`};
      return {q:`Có bao nhiêu số tự nhiên x thỏa mãn ${a} ≤ x ≤ ${b}? ___`,ans:String(b-a+1),x:`x nhận các giá trị từ ${a} đến ${b}: có ${b} − ${a} + 1 = ${b-a+1} số.`}},
    succ(r,U){const n=U.ri(r,100,99999);return r()<.5?{q:`Số liền sau của ${U.fmt(n)} là: ___`,ans:String(n+1)}:{q:`Số liền trước của ${U.fmt(n)} là: ___`,ans:String(n-1)}},
    findxadd(r,U){const v=U.ri(r,0,2);
      if(v===0){const a=U.ri(r,100,999),x=U.ri(r,100,999);return {q:`Tìm x, biết: x + ${a} = ${a+x}. x = ___`,ans:String(x),x:`x = ${a+x} − ${a} = ${x}.`}}
      if(v===1){const a=U.ri(r,100,999),b=U.ri(r,100,999);return {q:`Tìm x, biết: x − ${a} = ${b}. x = ___`,ans:String(a+b),x:`Số bị trừ = hiệu + số trừ: x = ${b} + ${a} = ${a+b}.`}}
      const a=U.ri(r,500,999),x=U.ri(r,100,a-50);return {q:`Tìm x, biết: ${a} − x = ${a-x}. x = ___`,ans:String(x),x:`Số trừ = số bị trừ − hiệu: x = ${a} − ${a-x} = ${x}.`}},
    findxmul(r,U){const v=U.ri(r,0,2),a=U.ri(r,3,25),x=U.ri(r,4,60);
      if(v===0)return {q:`Tìm x, biết: ${a} · x = ${a*x}. x = ___`,ans:String(x),x:`x = ${a*x} : ${a} = ${x}.`};
      if(v===1)return {q:`Tìm x, biết: x : ${a} = ${x}. x = ___`,ans:String(a*x),x:`Số bị chia = thương · số chia: x = ${x} · ${a} = ${a*x}.`};
      return {q:`Tìm x, biết: ${a*x} : x = ${a}. x = ___`,ans:String(x),x:`Số chia = số bị chia : thương: x = ${a*x} : ${a} = ${x}.`}},
    divrem(r,U){const b=U.ri(r,3,12),q=U.ri(r,10,99),rr=U.ri(r,1,b-1),n=b*q+rr,ask=r()<.5;
      return {q:`Chia ${n} cho ${b} được ${ask?"số dư":"thương"} là: ___`,ans:String(ask?rr:q),x:`${n} = ${b} · ${q} + ${rr} (0 < ${rr} < ${b}), nên thương là ${q}, số dư là ${rr}.`}},
    pow(r,U){const v=U.ri(r,0,2);
      if(v===0){const b=U.ri(r,2,5),e=U.ri(r,2,{2:10,3:6,4:5,5:4}[b]);return {q:`Giá trị của ${b}${U.sup(e)} là: ___`,ans:String(b**e),x:`${b}${U.sup(e)} là tích của ${e} thừa số ${b}: ${Array(e).fill(b).join(" · ")} = ${U.fmt(b**e)}.`}}
      if(v===1){const n=U.ri(r,2,6);return {q:`10${U.sup(n)} = ___`,ans:String(10**n),x:`10${U.sup(n)} là số 1 theo sau bởi ${n} chữ số 0: ${U.fmt(10**n)}.`}}
      const k=U.ri(r,11,20);return {q:`${k}${U.sup(2)} = ___`,ans:String(k*k),x:`${k}${U.sup(2)} = ${k} · ${k} = ${k*k}.`}},
    powmul(r,U){const a=U.ri(r,2,9),m=U.ri(r,2,9),n=U.ri(r,2,9);return {q:`${a}${U.sup(m)} · ${a}${U.sup(n)} = ${a}<sup>?</sup>. Số mũ cần điền là: ___`,ans:String(m+n),x:`Nhân hai lũy thừa cùng cơ số: giữ nguyên cơ số, cộng các số mũ: ${m} + ${n} = ${m+n}.`}},

      "Điệp ngữ: lặp lại một từ ngữ để nhấn mạnh ý, tạo nhịp điệu."]},
    {id:"t4",group:V2,short:"Cụm từ",name:"Cụm danh từ, cụm động từ, cụm tính từ",notes:[
      "Cụm danh từ: danh từ làm trung tâm cùng các từ ngữ phụ thuộc, ví dụ: tất cả những học sinh lớp 6A.",
      "Cụm động từ: động từ làm trung tâm, ví dụ: đang chạy trên sân.",
      "Cụm tính từ: tính từ làm trung tâm, ví dụ: rất đẹp, xanh như ngọc."]},
    {id:"d",group:V3,short:"Đọc hiểu",name:"Đọc hiểu văn bản mới (truyện, thơ)",notes:[
      "Xác định thể loại (truyện đồng thoại, truyện ngắn, thơ) và ngôi kể (thứ nhất hay thứ ba).",
      "Tìm nhân vật, sự việc chính; chú ý chi tiết thể hiện suy nghĩ, cảm xúc của nhân vật.",
      "Với thơ: đếm số tiếng mỗi dòng để biết thể thơ; tìm biện pháp tu từ và nêu tác dụng.",
      "Câu hỏi về bài học, thông điệp: trả lời bằng một câu ngắn gọn, đúng với nội dung văn bản."]}
  ],
  items:[
    // Bài 1
    {l:"v1",q:"Văn bản “Bài học đường đời đầu tiên” được trích từ tác phẩm nào?",o:["Dế Mèn phiêu lưu kí","Hoàng tử bé","Đất rừng phương Nam","Những người bạn"]},
    {l:"v1",q:"Tác giả của “Dế Mèn phiêu lưu kí” là:",o:["Tô Hoài","Nguyễn Nhật Ánh","Tạ Duy Anh","Thạch Lam"]},
    {l:"v1",q:"“Bài học đường đời đầu tiên” được kể theo ngôi thứ mấy?",o:["Ngôi thứ nhất, người kể là Dế Mèn","Ngôi thứ ba","Ngôi thứ nhất, người kể là Dế Choắt","Ngôi thứ hai"]},
    {l:"v1",q:"Vì sao Dế Choắt bị chết?",o:["Vì chị Cốc tưởng Dế Choắt trêu mình nên mổ","Vì Dế Choắt bị ốm nặng","Vì Dế Mèn đánh Dế Choắt","Vì Dế Choắt bị lạc đường"],x:"Dế Mèn trêu chị Cốc rồi chui vào hang, chị Cốc tưởng Dế Choắt trêu mình nên mổ Dế Choắt."},
    {l:"v1",q:"Bài học Dế Mèn rút ra sau cái chết của Dế Choắt là:",o:["Thói kiêu căng, hung hăng, thiếu suy nghĩ sẽ gây hại cho người khác và cho chính mình","Phải luôn giữ gìn sức khỏe","Không nên chơi với Dế Choắt","Phải đào hang thật sâu"]},
    {l:"v1",q:"Đặc điểm của truyện đồng thoại là:",o:["Nhân vật thường là loài vật, đồ vật được nhân hóa","Kể về các vị anh hùng có thật trong lịch sử","Luôn được viết bằng thơ","Chỉ dành cho người lớn đọc"]},
    {l:"v1",q:"Trong văn bản “Nếu cậu muốn có một người bạn”, hoàng tử bé gặp và trò chuyện với:",o:["con cáo","con rắn","người phi công","nhà vua"]},
    {l:"v1",q:"Tác giả của “Hoàng tử bé” là:",o:["Ăng-toan Đơ Xanh-tơ Ê-xu-pe-ri","An-đéc-xen","Ta-go","Lu-i Xe-pun-ve-đa"]},
    {l:"v1",q:"Thông điệp chính của “Nếu cậu muốn có một người bạn” là:",o:["Muốn có tình bạn thật sự cần kiên nhẫn, dành thời gian và có trách nhiệm với nhau","Bạn bè càng nhiều càng tốt","Không nên tin ai","Chỉ con người mới làm bạn được với nhau"]},
    {l:"v1",q:"Bài thơ “Bắt nạt” là của tác giả nào?",o:["Nguyễn Thế Hoàng Linh","Xuân Quỳnh","Mai Văn Phấn","Tô Hoài"]},
    {l:"v1",q:"Bài thơ “Bắt nạt” muốn nhắn nhủ điều gì?",o:["Đừng bắt nạt người khác, hãy sống thân thiện, yêu thương","Phải học thật giỏi","Nên chơi một mình","Cần tập thể dục mỗi ngày"]},
    {l:"v1",q:"Các nhân vật trong “Bài học đường đời đầu tiên” là:",o:["Dế Mèn, Dế Choắt, chị Cốc","Dế Mèn, con cáo, hoàng tử bé","Kiều Phương, người anh","Sơn, Lan, Hiên"]},
    {l:"v1",tf:true,q:"Dế Mèn hối hận vì trò nghịch dại của mình đã gây ra cái chết của Dế Choắt."},
    // Bài 2
    {l:"v2",q:"Bài thơ “Chuyện cổ tích về loài người” là của tác giả nào?",o:["Xuân Quỳnh","Tố Hữu","Nguyễn Thế Hoàng Linh","Mai Văn Phấn"]},
    {l:"v2",q:"“Chuyện cổ tích về loài người” được viết theo thể thơ nào?",o:["Thơ năm chữ","Thơ lục bát","Thơ bốn chữ","Thơ tự do"]},
    {l:"v2",q:"Theo bài thơ “Chuyện cổ tích về loài người”, trên Trái Đất ai được sinh ra trước nhất?",o:["trẻ em","mặt trời","người mẹ","cây cối"]},
    {l:"v2",q:"Nội dung chính của bài thơ “Chuyện cổ tích về loài người” là:",o:["Mọi thứ trên đời được tạo ra vì trẻ em, thể hiện tình yêu thương dành cho trẻ","Kể về cuộc phiêu lưu của một chú dế","Ca ngợi cảnh đẹp quê hương","Khuyên trẻ em chăm làm việc nhà"]},
    {l:"v2",q:"“Mây và sóng” là tác phẩm của nhà thơ nào?",o:["Ta-go (Ấn Độ)","An-đéc-xen (Đan Mạch)","Ê-xu-pe-ri (Pháp)","Xuân Quỳnh (Việt Nam)"]},
    {l:"v2",q:"Trong bài thơ “Mây và sóng”, em bé đã làm gì khi được mây và sóng rủ đi chơi?",o:["Từ chối để ở nhà với mẹ","Đi chơi cùng mây","Đi chơi cùng sóng","Rủ mẹ cùng đi"]},
    {l:"v2",q:"Bài thơ “Mây và sóng” ca ngợi điều gì?",o:["Tình yêu thương giữa mẹ và con","Vẻ đẹp của biển","Tình bạn","Lòng dũng cảm"]},
    {l:"v2",q:"Truyện “Bức tranh của em gái tôi” được kể theo ngôi nào?",o:["Ngôi thứ nhất, người anh xưng “tôi”","Ngôi thứ nhất, Kiều Phương xưng “tôi”","Ngôi thứ ba","Ngôi thứ hai"]},
    {l:"v2",q:"Tác giả của “Bức tranh của em gái tôi” là:",o:["Tạ Duy Anh","Tô Hoài","Thạch Lam","Nguyễn Nhật Ánh"]},
    {l:"v2",q:"Tên của cô em gái trong truyện “Bức tranh của em gái tôi” là:",o:["Kiều Phương","Hiên","Lan","Thủy"]},
    {l:"v2",q:"Khi đứng trước bức tranh em gái vẽ mình, người anh có tâm trạng:",o:["ngạc nhiên, hãnh diện rồi xấu hổ","tức giận","vui vì được nhận giải","buồn chán"]},
    {l:"v2",q:"Yếu tố tự sự trong thơ là:",o:["kể lại sự việc, câu chuyện","gợi tả cảnh vật bằng hình ảnh","số tiếng trong mỗi dòng thơ","cách gieo vần cuối dòng"]},
    {l:"v2",q:"Yếu tố miêu tả trong thơ thể hiện qua:",o:["những hình ảnh, chi tiết gợi tả cảnh vật, con người","lời kể về một sự việc","lời đối thoại giữa nhân vật","số khổ thơ"]},
    // Bài 3
    {l:"v3",q:"“Cô bé bán diêm” là truyện của nhà văn nào?",o:["An-đéc-xen","Ta-go","Tô Hoài","Thạch Lam"]},
    {l:"v3",q:"Câu chuyện “Cô bé bán diêm” diễn ra vào thời điểm nào?",o:["đêm giao thừa","buổi sáng mùa hè","đêm Trung thu","ngày khai trường"]},
    {l:"v3",q:"Mỗi lần quẹt diêm, cô bé thấy những gì?",o:["lò sưởi, bàn ăn có ngỗng quay, cây thông Nô-en, người bà","biển cả và mặt trời","ngôi nhà mới của mình","những người bạn cùng lớp"]},
    {l:"v3",q:"Những mộng tưởng của cô bé khi quẹt diêm thể hiện điều gì?",o:["Khao khát được ấm no, được yêu thương","Mong muốn được đi du lịch","Ước mơ trở thành người bán diêm giỏi","Mong trời mau sáng để đi học"]},
    {l:"v3",q:"“Gió lạnh đầu mùa” là tác phẩm của:",o:["Thạch Lam","Nam Cao","Tô Hoài","Tạ Duy Anh"]},
    {l:"v3",q:"Trong “Gió lạnh đầu mùa”, Sơn và Lan đã cho bé Hiên vật gì?",o:["chiếc áo bông cũ","một chiếc khăn len","một bao gạo","đôi giày mới"]},
    {l:"v3",q:"Câu chuyện “Gió lạnh đầu mùa” ca ngợi điều gì?",o:["Lòng nhân hậu, biết chia sẻ với người nghèo khó","Lòng dũng cảm khi chiến đấu","Tình yêu thiên nhiên","Sự chăm chỉ học tập"]},
    {l:"v3",q:"Truyện “Cô bé bán diêm” được kể theo ngôi thứ mấy?",o:["Ngôi thứ ba","Ngôi thứ nhất","Ngôi thứ hai","Không có người kể"]},
    {l:"v3",q:"Tác giả của bài thơ “Con chào mào” là:",o:["Mai Văn Phấn","Xuân Quỳnh","Nguyễn Thế Hoàng Linh","Trần Đăng Khoa"]},
    {l:"v3",q:"Đặc điểm của người kể chuyện ngôi thứ ba là:",o:["Người kể giấu mình, gọi nhân vật bằng tên","Người kể xưng “tôi” và là nhân vật chính","Người kể xưng “chúng ta”","Người kể luôn là tác giả xuất hiện trong truyện"]},
    {l:"v3",tf:true,q:"An-đéc-xen là nhà văn Đan Mạch, nổi tiếng với nhiều truyện cổ tích viết cho thiếu nhi."},
    // Từ đơn, từ phức
    {l:"t1",q:"Từ nào là từ đơn?",o:["sách","sách vở","học sinh","bút chì"]},
    {l:"t1",q:"Từ nào là từ láy?",o:["lấp lánh","nhà cửa","bàn ghế","hoa hồng"]},
    {l:"t1",q:"Từ nào là từ ghép?",o:["xe đạp","rì rào","lom khom","xinh xắn"]},
    {l:"t1",q:"Dòng nào gồm toàn từ láy?",o:["long lanh, thăm thẳm, rì rầm","long lanh, xe máy, rì rầm","quần áo, sách vở, bàn ghế","nhà, cây, núi"]},
    {l:"t1",q:"Từ “mưa” thuộc loại từ nào?",o:["từ đơn","từ ghép","từ láy","cụm từ"]},
    {l:"t1",q:"Từ “lao xao” là:",o:["từ láy","từ ghép","từ đơn","danh từ riêng"]},
    {l:"t1",q:"Từ “quần áo” là:",o:["từ ghép","từ láy","từ đơn","cụm động từ"]},
    {l:"t1",q:"Từ láy trong câu “Tiếng suối chảy róc rách bên sườn núi.” là:",o:["róc rách","tiếng suối","sườn núi","chảy"]},
    {l:"t1",q:"Trong câu “Mặt hồ phẳng lặng, lấp lánh ánh trăng.”, từ láy là:",o:["lấp lánh","phẳng lặng","mặt hồ","ánh trăng"]},
    {l:"t1",q:"Từ phức gồm những loại nào?",o:["từ ghép và từ láy","từ đơn và từ ghép","từ đơn và từ láy","danh từ và động từ"]},
    {l:"t1",tf:false,q:"“Học sinh” là từ láy.",x:"“Học sinh” là từ ghép: hai tiếng “học” và “sinh” quan hệ với nhau về nghĩa."},
    {l:"t1",q:"Các từ “xanh xanh, đo đỏ, vàng vàng” thuộc loại:",o:["từ láy","từ ghép","từ đơn","từ Hán Việt"]},
    {l:"t1",q:"Từ nào là từ ghép?",o:["hoa quả","líu lo","chiêm chiếp","lóng lánh"]},
    {l:"t1",q:"Câu “Em đi học.” có mấy từ đơn?",o:["3","2","1","4"],x:"Em / đi / học – ba từ, mỗi từ một tiếng."},
    // Nghĩa của từ
    {l:"t2",q:"“Kiêu căng” có nghĩa là:",o:["tự cho mình hơn người, coi thường người khác","khiêm tốn, nhã nhặn","nhút nhát, rụt rè","chăm chỉ, cần cù"]},
    {l:"t2",q:"Từ “hối hận” được giải thích đúng là:",o:["lấy làm tiếc và thấy có lỗi về việc mình đã làm","vui mừng vì đã làm xong việc","lo lắng về việc sắp xảy ra","tức giận với người khác"]},
    {l:"t2",q:"Giải thích “dũng cảm” là “gan dạ” là cách giải thích bằng:",o:["từ đồng nghĩa","từ trái nghĩa","nêu khái niệm","miêu tả sự vật"]},
    {l:"t2",q:"Giải thích “cao thượng” là “không nhỏ nhen, ti tiện” là cách giải thích bằng:",o:["từ trái nghĩa","từ đồng nghĩa","kể chuyện","so sánh"]},
    {l:"t2",q:"Từ nào đồng nghĩa với “chăm chỉ”?",o:["siêng năng","lười biếng","nhanh nhẹn","thông minh"]},
    {l:"t2",q:"Từ nào trái nghĩa với “hiền lành”?",o:["độc ác","tốt bụng","nhân hậu","dịu dàng"]},
    {l:"t2",q:"“Ân hận” có nghĩa gần nhất với từ nào?",o:["hối hận","sung sướng","tự hào","giận dữ"]},
    {l:"t2",q:"Trong câu “Bầu trời xanh thăm thẳm.”, từ “thăm thẳm” có nghĩa là:",o:["sâu và xa đến mức như không có giới hạn","rất thấp","rất gần","tối om"]},
    {l:"t2",q:"“Nhân hậu” có nghĩa là:",o:["có lòng thương người, đối xử có tình nghĩa","giàu có","thông minh","khỏe mạnh"]},
    {l:"t2",q:"Từ “tinh nghịch” phù hợp nhất để miêu tả:",o:["một em bé hay bày trò vui","một cụ già trầm tư","một dòng sông lặng lẽ","một buổi chiều buồn"]},
    // Biện pháp tu từ
    {l:"t3",q:"Câu nào có sử dụng biện pháp so sánh?",o:["Mặt hồ sáng long lanh như một tấm gương.","Mặt hồ rất rộng.","Em đi dạo quanh hồ.","Hồ có nhiều cá."]},
    {l:"t3",q:"Câu nào có sử dụng biện pháp nhân hóa?",o:["Chị gió nhẹ nhàng ru cho cây ngủ.","Gió thổi mạnh.","Trời có gió mùa đông bắc.","Gió làm lá rơi."]},
    {l:"t3",q:"Trong câu ca dao “Thuyền về có nhớ bến chăng”, hình ảnh “thuyền” là:",o:["ẩn dụ chỉ người đi xa","so sánh","nhân hóa","điệp ngữ"]},
    {l:"t3",q:"Từ ngữ nào thường dùng trong phép so sánh?",o:["như","và","nhưng","vì"]},
    {l:"t3",q:"Câu “Đất nước em như một bài ca.” sử dụng biện pháp tu từ:",o:["so sánh","nhân hóa","ẩn dụ","điệp ngữ"]},
    {l:"t3",q:"Câu nào có sử dụng điệp ngữ?",o:["Em yêu cánh đồng, em yêu dòng sông, em yêu mái trường.","Mặt trời đỏ như quả cầu lửa.","Hàng cây đứng nghiêm chào đón chúng em.","Bông hoa rất đẹp."]},
    {l:"t3",q:"Câu “Những ông sao bé nhỏ nháy mắt nhìn em.” sử dụng biện pháp:",o:["nhân hóa","so sánh","ẩn dụ","điệp ngữ"]},
    {l:"t3",q:"Tác dụng của biện pháp so sánh là:",o:["làm cho sự vật, sự việc được miêu tả sinh động, gợi hình, gợi cảm hơn","làm câu văn dài hơn","giúp người đọc nhớ tên tác giả","để kết thúc đoạn văn"]},
    {l:"t3",q:"Biện pháp ẩn dụ khác so sánh ở chỗ:",o:["ẩn dụ chỉ nêu sự vật dùng để so sánh, ẩn đi sự vật được nói đến","ẩn dụ luôn dùng từ “như”","ẩn dụ chỉ dùng trong văn xuôi","ẩn dụ là lặp lại từ ngữ"]},
    {l:"t3",q:"Câu nào sử dụng điệp ngữ?",o:["Học, học nữa, học mãi.","Em học bài rất chăm.","Bạn Lan học giỏi như anh.","Sách là người bạn tốt."]},
    {l:"t3",tf:true,q:"Nhân hóa là gọi hoặc tả con vật, đồ vật, cây cối bằng những từ ngữ vốn dùng để gọi hoặc tả con người."},
    {l:"t3",q:"Câu “Cây bàng già đứng lặng lẽ giữa sân trường, xòe tán lá che mát cho chúng em.” dùng biện pháp tu từ:",o:["nhân hóa","so sánh","điệp ngữ","ẩn dụ"]},

    {l:"d",t:"Chú Sẻ Nâu",rd:`Tôi là Sẻ Nâu, sống trong một tổ nhỏ trên mái ngói nhà ông Tư. Hồi mới biết bay, tôi tự cho mình là con chim nhanh nhất vùng. Tôi hay bay sà xuống trêu lũ gà con, giật miếng mồi của bác Bồ Câu rồi vụt bay mất, cười khanh khách.

Một chiều, trời nổi giông. Tôi mải đùa nên bay ra xa, cánh ướt sũng, không về tổ được. Đang run rẩy dưới tán lá chuối, tôi nghe tiếng gọi. Hóa ra bác Bồ Câu – người tôi vẫn hay trêu chọc – đã bay đi tìm tôi. Bác xòe cánh che cho tôi đến khi tạnh mưa.

Đêm ấy, nằm trong tổ ấm, tôi thấy mặt mình nóng ran. Tôi tự hứa từ nay sẽ sống tử tế hơn với mọi người.`,qs:[

      {q:"Văn bản được kể theo ngôi thứ mấy?",o:["Ngôi thứ nhất, người kể là Sẻ Nâu","Ngôi thứ ba","Ngôi thứ nhất, người kể là bác Bồ Câu","Ngôi thứ hai"]},
      {q:"Ai đã giúp Sẻ Nâu trong cơn giông?",o:["bác Bồ Câu","ông Tư","lũ gà con","cây chuối"]},
      {q:"Chi tiết “tôi thấy mặt mình nóng ran” cho thấy Sẻ Nâu đang cảm thấy:",o:["xấu hổ, ân hận","vui sướng","sợ hãi vì trời lạnh","tức giận"]},

    {l:"d",t:"Tiếng mưa (thơ)",rd:`Mẹ ơi, con nghe thấy

Con nằm trong chăn ấm

Lời mẹ như dòng suối
Chảy suốt những đêm mưa.

Mai con lớn khôn rồi
Đi xa ngàn dặm nữa
Vẫn nhớ tiếng mưa rơi

      {q:"Hai dòng “Như ai đang đánh nhịp / Cho cây lá hát ca” sử dụng biện pháp tu từ nào?",o:["so sánh và nhân hóa","chỉ có điệp ngữ","chỉ có ẩn dụ","không có biện pháp tu từ"],x:"Tiếng mưa được so sánh “như ai đang đánh nhịp”; cây lá “hát ca” là nhân hóa."},

      {q:"Trong dòng “Vẫn nhớ tiếng mưa rơi”, cụm từ “vẫn nhớ tiếng mưa rơi” là:",o:["cụm động từ","cụm danh từ","cụm tính từ","từ láy"]}]},
    {l:"d",t:"Đôi giày của Tú",rd:`Tú được bố mua cho đôi giày thể thao mới. Cậu nâng niu nó, chẳng dám đi ra sân vì sợ bẩn. Trong lớp, Tú để ý thấy Khoa – cậu bạn ngồi cạnh – luôn đi đôi dép nhựa đã mòn, ngay cả trong giờ thể dục.

Hôm hội thao, Khoa được chọn chạy tiếp sức nhưng cứ lúng túng nhìn xuống chân. Tú hiểu ra. Cậu lặng lẽ tháo đôi giày của mình: "Cậu đi thử đi, chân hai đứa mình bằng nhau mà." Khoa ngập ngừng rồi nhận lấy.

Đội lớp 6A về nhất. Khoa chạy đến trả giày, mắt sáng long lanh. Tú cười, thấy đôi giày lấm bụi mà lòng mình lại sạch bong, nhẹ nhõm.`,qs:[

      {q:"Việc Tú cho bạn mượn giày cho thấy Tú là người:",o:["biết quan tâm, sẻ chia","nóng tính","ích kỉ","nhút nhát"]},
      {q:"Câu “đôi giày lấm bụi mà lòng mình lại sạch bong, nhẹ nhõm” có cách diễn đạt nào?",o:["đối lập giữa đôi giày bẩn và tâm hồn trong sáng, thanh thản","so sánh đôi giày với cái chổi","nhân hóa đôi giày","điệp ngữ"]},
      {q:"Cụm từ “đôi giày thể thao mới” là:",o:["cụm danh từ","cụm động từ","cụm tính từ","từ ghép"]}]},
    {l:"d",t:"Hạt Mưa Nhỏ",rd:`Trên đám mây xám, Hạt Mưa Nhỏ sợ hãi níu lấy mẹ: "Con không muốn rơi xuống đâu. Dưới kia lạ lắm!" Mẹ Mây dịu dàng: "Mỗi hạt mưa đều có một việc phải làm. Con hãy đi đi, rồi con sẽ hiểu."

Hạt Mưa Nhỏ nhắm mắt buông tay. Nó rơi xuống một cánh đồng khô nẻ. Ngay lập tức, mầm lúa non ngẩng lên, reo khẽ: "Cảm ơn bạn! Mình khát quá!" Hạt Mưa Nhỏ thấm vào đất, mát lành. Nó thấy mình thật có ích.

Vài hôm sau, ông Mặt Trời ló ra, sưởi ấm cánh đồng. Hạt Mưa Nhỏ hóa thành hơi nước, bay lên, trở về với mẹ Mây. Nó kể cho mẹ nghe về mầm lúa và hứa sẽ lại xuống giúp đồng ruộng vào mùa sau.`,qs:[
      {q:"Nhân vật trong văn bản chủ yếu là:",o:["sự vật được nhân hóa (hạt mưa, đám mây, mầm lúa)","những con người có thật","các vị thần","những con vật trong rừng"]},
      {q:"Lúc đầu, Hạt Mưa Nhỏ có tâm trạng thế nào?",o:["sợ hãi, không muốn rơi xuống","vui vẻ, háo hức","tức giận","buồn ngủ"]},
      {q:"Điều gì khiến Hạt Mưa Nhỏ thấy mình có ích?",o:["Nó giúp mầm lúa đang khát có nước","Nó được trở về với mẹ","Nó được ông Mặt Trời sưởi ấm","Nó bay được rất cao"]},
      {q:"Bài học rút ra từ câu chuyện là:",o:["Ai cũng có thể làm điều có ích, hãy mạnh dạn làm việc của mình","Không nên rời xa mẹ","Trời mưa thì nên ở nhà","Mặt Trời quan trọng hơn mưa"]},

    {l:"d",t:"Người bạn mới",rd:`Năm học lớp 6, lớp tôi có thêm một bạn mới tên là Mai. Mai ít nói, giọng hơi khác chúng tôi vì bạn chuyển từ miền Trung ra. Mấy bạn trong lớp hay nhại giọng Mai để trêu. Tôi cũng từng cười theo.

Một lần, tôi bị điểm kém môn Toán, ngồi buồn ở góc sân. Mai đến ngồi cạnh, chìa ra cuốn vở ghi chép cẩn thận: "Bài này khó, mình giảng lại cho cậu nhé." Suốt buổi chiều hôm ấy, Mai kiên nhẫn chỉ cho tôi từng bước.

Tôi nhìn Mai, chợt thấy ngượng ngùng. Hóa ra người bạn mà tôi từng cười cợt lại tốt bụng đến thế. Từ hôm đó, tôi và Mai trở thành đôi bạn thân.`,qs:[

      {q:"Cảm giác “ngượng ngùng” của nhân vật “tôi” cho thấy:",o:["“Tôi” nhận ra mình đã cư xử chưa đúng với Mai","“Tôi” sợ bị điểm kém","“Tôi” không thích Mai","“Tôi” muốn về nhà"]},

    {id:"b1",group:C1,short:"Bài 1",name:"Tập hợp",notes:["Tập hợp thường được kí hiệu bằng chữ in hoa: A, B, C…","a ∈ A: a thuộc A; b ∉ A: b không thuộc A.","Hai cách cho tập hợp: liệt kê các phần tử, hoặc chỉ ra tính chất đặc trưng. Ví dụ: A = {0; 1; 2; 3} = {x ∈ ℕ | x < 4}.","ℕ là tập hợp các số tự nhiên; ℕ* là tập hợp các số tự nhiên khác 0."]},
    {id:"b2",group:C1,short:"Bài 2",name:"Cách ghi số tự nhiên",notes:["Hệ thập phân dùng 10 chữ số 0, 1, …, 9; giá trị của mỗi chữ số phụ thuộc vào vị trí của nó.","Ví dụ: 2 024 = 2 · 1 000 + 0 · 100 + 2 · 10 + 4.","Số La Mã: I = 1, V = 5, X = 10. Chữ số nhỏ đứng trước chữ số lớn thì trừ: IV = 4, IX = 9. Ví dụ: XIV = 14, XXIX = 29."]},
    {id:"b3",group:C1,short:"Bài 3",name:"Thứ tự trong tập hợp các số tự nhiên",notes:["Trong hai số tự nhiên khác nhau, có một số nhỏ hơn số kia.","Mỗi số tự nhiên có đúng một số liền sau; mỗi số tự nhiên khác 0 có đúng một số liền trước.","a ≤ b nghĩa là a < b hoặc a = b."]},
    {id:"b4",group:C1,short:"Bài 4",name:"Phép cộng và phép trừ số tự nhiên",notes:["Giao hoán: a + b = b + a. Kết hợp: (a + b) + c = a + (b + c).","Số hạng chưa biết = tổng − số hạng đã biết.","Số bị trừ = hiệu + số trừ; số trừ = số bị trừ − hiệu."]},
    {id:"b5",group:C1,short:"Bài 5",name:"Phép nhân và phép chia số tự nhiên",notes:["a · b = b · a; (a · b) · c = a · (b · c); a · (b + c) = a · b + a · c.","Phép chia có dư: a = b · q + r với 0 < r < b. Nếu r = 0 thì a chia hết cho b.","Không có phép chia cho 0."]},
    {id:"b6",group:C1,short:"Bài 6",name:"Lũy thừa với số mũ tự nhiên",notes:["aⁿ = a · a · … · a (n thừa số a); a là cơ số, n là số mũ.","aᵐ · aⁿ = aᵐ⁺ⁿ; aᵐ : aⁿ = aᵐ⁻ⁿ (a ≠ 0, m ≥ n).","Quy ước: a¹ = a; a⁰ = 1 (a ≠ 0)."]},
    {id:"b7",group:C1,short:"Bài 7",name:"Thứ tự thực hiện các phép tính",notes:["Không có dấu ngoặc: lũy thừa → nhân, chia → cộng, trừ.","Có dấu ngoặc: ( ) → [ ] → { }.","Các phép tính cùng loại thì thực hiện từ trái sang phải."]},
    {id:"b8",group:C2,short:"Bài 8",name:"Quan hệ chia hết và tính chất",notes:["a chia hết cho b (b ≠ 0) nếu có số tự nhiên q sao cho a = b · q; kí hiệu a ⋮ b. Khi đó a là bội của b, b là ước của a.","Nếu tất cả các số hạng của tổng đều chia hết cho m thì tổng chia hết cho m.","Nếu chỉ có một số hạng không chia hết cho m, còn lại đều chia hết cho m, thì tổng không chia hết cho m."]},
    {id:"b9",group:C2,short:"Bài 9",name:"Dấu hiệu chia hết",notes:["Chia hết cho 2: chữ số tận cùng là 0, 2, 4, 6, 8. Chia hết cho 5: tận cùng là 0 hoặc 5.","Chia hết cho 9: tổng các chữ số chia hết cho 9. Chia hết cho 3: tổng các chữ số chia hết cho 3.","Số chia hết cho 9 thì chia hết cho 3; điều ngược lại không phải lúc nào cũng đúng."]},
    {id:"b10",group:C2,short:"Bài 10",name:"Số nguyên tố",notes:["Số nguyên tố là số tự nhiên lớn hơn 1, chỉ có hai ước là 1 và chính nó.","Hợp số là số tự nhiên lớn hơn 1, có nhiều hơn hai ước. Số 0 và số 1 không là số nguyên tố, cũng không là hợp số.","Mọi hợp số đều phân tích được ra thừa số nguyên tố, ví dụ: 60 = 2<sup>2</sup> · 3 · 5."]},
    {id:"b11",group:C2,short:"Bài 11",name:"Ước chung. Ước chung lớn nhất",notes:["Ước chung của hai số là số vừa là ước của số này, vừa là ước của số kia.","Tìm ƯCLN: phân tích ra thừa số nguyên tố, chọn các thừa số chung, lấy số mũ nhỏ nhất, rồi nhân lại.","Nếu ƯCLN(a, b) = 1 thì a và b là hai số nguyên tố cùng nhau."]},
    {id:"b12",group:C2,short:"Bài 12",name:"Bội chung. Bội chung nhỏ nhất",notes:["Bội chung của hai số là số vừa là bội của số này, vừa là bội của số kia.","Tìm BCNN: phân tích ra thừa số nguyên tố, chọn các thừa số chung và riêng, lấy số mũ lớn nhất, rồi nhân lại.","Nếu a ⋮ b thì BCNN(a, b) = a."]},
    {id:"b13",group:C3,short:"Bài 13",name:"Tập hợp các số nguyên",notes:["ℤ = {…; −2; −1; 0; 1; 2; …} là tập hợp các số nguyên.","Số đối của a là −a: số đối của 5 là −5, số đối của −3 là 3.","Trên trục số nằm ngang, điểm bên trái biểu diễn số nhỏ hơn. Mọi số nguyên âm đều nhỏ hơn 0."]},
    {id:"b14",group:C3,short:"Bài 14",name:"Phép cộng và phép trừ số nguyên",notes:["Cộng hai số nguyên âm: cộng phần số tự nhiên rồi đặt dấu “−” trước kết quả.","Cộng hai số nguyên khác dấu: lấy số lớn trừ số nhỏ (phần số tự nhiên), rồi đặt dấu của số có phần số tự nhiên lớn hơn.","a − b = a + (−b)."]},
    {id:"b15",group:C3,short:"Bài 15",name:"Quy tắc dấu ngoặc",notes:["Bỏ ngoặc có dấu “+” đằng trước: giữ nguyên dấu các số hạng trong ngoặc.","Bỏ ngoặc có dấu “−” đằng trước: đổi dấu tất cả các số hạng trong ngoặc."]},
    {id:"b16",group:C3,short:"Bài 16",name:"Phép nhân số nguyên",notes:["Tích hai số nguyên cùng dấu là số dương; tích hai số nguyên khác dấu là số âm.","a · 0 = 0.","Phép nhân số nguyên có tính chất giao hoán, kết hợp, phân phối đối với phép cộng."]},
    {id:"b17",group:C3,short:"Bài 17",name:"Phép chia hết. Ước và bội của một số nguyên",notes:["a chia hết cho b (b ≠ 0) nếu có số nguyên q sao cho a = b · q.","Nếu a là bội của b thì −a cũng là bội của b.","Ví dụ: các ước của 6 là −6; −3; −2; −1; 1; 2; 3; 6."]}
  ],

const K1="Mở đầu về Khoa học tự nhiên", K2="Chất quanh ta", K3="Vật liệu, nhiên liệu, nguyên liệu, lương thực – thực phẩm", K4="Chất tinh khiết, hỗn hợp", K5="Tế bào (học song song)", K6="Lực (học song song)";

  scopeText:"Sách Khoa học tự nhiên 6 Kết nối tri thức với cuộc sống. Trường dạy cuốn chiếu: Bài 1–15. Trường dạy song song: Bài 1–9, 17–19, 35–36. Chọn đúng cách trường bạn dạy ở phần đề thi thử.",
  test:{n:20,mins:35,count:12,scopes:[{id:"cuon",name:"Cuốn chiếu",note:"Bài 1–15",lessons:CUON},{id:"song",name:"Song song",note:"Bài 1–9, 17–19, 35–36",lessons:SONG}]},
  lessons:[
    {id:"k1",group:K1,short:"Bài 1",name:"Giới thiệu về Khoa học tự nhiên",notes:["KHTN nghiên cứu các sự vật, hiện tượng, quy luật tự nhiên và ảnh hưởng của chúng đến con người, môi trường.","Vai trò: nâng cao hiểu biết, phát triển sản xuất, chăm sóc sức khỏe, bảo vệ môi trường."]},
    {id:"k2",group:K1,short:"Bài 2",name:"Các lĩnh vực chủ yếu của Khoa học tự nhiên",notes:["Vật lí: vật chất, năng lượng, chuyển động. Hóa học: chất và sự biến đổi của chất. Sinh học: sinh vật và sự sống. Khoa học Trái Đất, Thiên văn học: Trái Đất và bầu trời.","Vật sống có trao đổi chất, lớn lên, sinh sản; vật không sống thì không."]},
    {id:"k3",group:K1,short:"Bài 3",name:"An toàn trong phòng thực hành. Kính lúp, kính hiển vi",notes:["Chỉ làm thí nghiệm khi có hướng dẫn của giáo viên; không ăn uống, đùa nghịch, không nếm hay ngửi trực tiếp hóa chất.","Chú ý các kí hiệu cảnh báo: chất độc, chất dễ cháy, chất ăn mòn, điện cao thế…","Kính lúp quan sát vật nhỏ; kính hiển vi quang học quan sát vật rất nhỏ như tế bào."]},
    {id:"k4",group:K1,short:"Bài 4",name:"Đo chiều dài",notes:["Đơn vị đo chiều dài trong hệ đơn vị đo lường hợp pháp của nước ta là mét (m). 1 km = 1 000 m; 1 m = 100 cm; 1 cm = 10 mm.","Giới hạn đo (GHĐ): độ dài lớn nhất ghi trên thước. Độ chia nhỏ nhất (ĐCNN): độ dài giữa hai vạch chia liên tiếp.","Khi đo: ước lượng, chọn thước phù hợp, đặt thước dọc theo vật, một đầu vật ngang vạch 0, mắt nhìn vuông góc với thước."]},
    {id:"k5",group:K1,short:"Bài 5",name:"Đo khối lượng",notes:["Khối lượng là số đo lượng chất của vật. Đơn vị là ki-lô-gam (kg).","1 tấn = 1 000 kg; 1 kg = 1 000 g; 1 g = 1 000 mg.","Dụng cụ: cân (cân đồng hồ, cân điện tử, cân Rô-béc-van…). Trước khi cân, chỉnh kim (hoặc số hiển thị) về 0."]},
    {id:"k6",group:K1,short:"Bài 6",name:"Đo thời gian",notes:["Đơn vị đo thời gian là giây (s). 1 giờ = 60 phút = 3 600 giây.","Dụng cụ: đồng hồ treo tường, đồng hồ đeo tay, đồng hồ bấm giây (đo khoảng thời gian ngắn, cần chính xác)."]},
    {id:"k7",group:K1,short:"Bài 7",name:"Thang nhiệt độ Celsius. Đo nhiệt độ",notes:["Nhiệt độ cho biết mức độ nóng, lạnh của vật. Đơn vị thường dùng ở nước ta là độ C (°C).","Thang Celsius: nước đá đang tan là 0 °C; nước đang sôi (ở áp suất tiêu chuẩn) là 100 °C.","Dụng cụ: nhiệt kế (y tế, rượu, điện tử…). Không dùng tay để xác định chính xác nhiệt độ."]},
    {id:"k8",group:K2,short:"Bài 8",name:"Sự đa dạng và các thể cơ bản của chất. Tính chất của chất",notes:["Chất có trong vật thể tự nhiên, vật thể nhân tạo, vật sống và vật không sống.","Thể rắn: hình dạng và thể tích xác định, khó nén. Thể lỏng: thể tích xác định, hình dạng theo vật chứa, khó nén. Thể khí: không có hình dạng và thể tích xác định, dễ nén.","Chuyển thể: nóng chảy (rắn → lỏng), đông đặc (lỏng → rắn), bay hơi (lỏng → hơi), ngưng tụ (hơi → lỏng).","Tính chất vật lí: thể, màu, mùi, nhiệt độ sôi… Tính chất hóa học: khả năng biến đổi thành chất khác (cháy, gỉ…)."]},
    {id:"k9",group:K2,short:"Bài 9",name:"Oxygen",notes:["Ở điều kiện thường, oxygen là chất khí không màu, không mùi, không vị, ít tan trong nước.","Oxygen duy trì sự hô hấp và sự cháy.","Oxygen hóa lỏng ở −183 °C, khi đó có màu xanh nhạt."]},
    {id:"k10",group:K2,short:"Bài 10",name:"Không khí và bảo vệ môi trường không khí",notes:["Theo thể tích, không khí có khoảng 78% nitrogen, 21% oxygen, 1% các khí khác (carbon dioxide, hơi nước, khí hiếm…).","Nguyên nhân ô nhiễm: khí thải xe cộ, nhà máy, đốt rác, cháy rừng…","Bảo vệ: trồng cây xanh, đi phương tiện công cộng, xe đạp, dùng năng lượng sạch, không đốt rác bừa bãi."]},
    {id:"k11",group:K3,short:"Bài 11",name:"Một số vật liệu thông dụng",notes:["Vật liệu thông dụng: kim loại, nhựa, cao su, thủy tinh, gốm, gỗ…","Kim loại dẫn điện, dẫn nhiệt tốt; sắt dễ bị gỉ. Nhựa nhẹ, cách điện, khó phân hủy. Thủy tinh trong suốt, dễ vỡ. Cao su đàn hồi, cách điện.","Sử dụng vật liệu an toàn, tiết kiệm; tái chế để bảo vệ môi trường."]},
    {id:"k12",group:K3,short:"Bài 12",name:"Nhiên liệu và an ninh năng lượng",notes:["Nhiên liệu là những chất cháy được, khi cháy tỏa nhiệt và phát sáng: than, xăng, dầu, khí gas, củi…","Nhiên liệu hóa thạch (than đá, dầu mỏ, khí thiên nhiên) có hạn, cần dùng tiết kiệm, hiệu quả.","Khuyến khích dùng năng lượng tái tạo: mặt trời, gió, nước."]},
    {id:"k13",group:K3,short:"Bài 13",name:"Một số nguyên liệu",notes:["Nguyên liệu là vật liệu tự nhiên chưa qua chế biến, cần xử lí để tạo ra sản phẩm.","Quặng sắt → gang, thép; đá vôi → vôi sống, xi măng; cát → thủy tinh; mủ cao su → cao su.","Khai thác nguyên liệu cần hợp lí, tiết kiệm, bảo vệ môi trường."]},
    {id:"k14",group:K3,short:"Bài 14",name:"Một số lương thực – thực phẩm",notes:["Lương thực: thức ăn chứa nhiều tinh bột (gạo, ngô, khoai, sắn, lúa mì).","Thực phẩm cung cấp: chất bột, chất đạm, chất béo, vitamin và chất khoáng.","Ăn đa dạng, cân đối; bảo quản thực phẩm đúng cách, chọn thực phẩm an toàn."]},
    {id:"k15",group:K4,short:"Bài 15",name:"Chất tinh khiết – Hỗn hợp",notes:["Chất tinh khiết chỉ gồm một chất (ví dụ: nước cất).","Hỗn hợp gồm hai hay nhiều chất trộn lẫn (nước muối, không khí, nước biển).","Dung dịch: hỗn hợp đồng nhất (nước muối). Huyền phù: chất rắn lơ lửng trong chất lỏng (nước phù sa). Nhũ tương: chất lỏng lơ lửng trong chất lỏng khác (dầu ăn lắc với nước)."]},
    {id:"k17",group:K5,short:"Bài 17",name:"Tế bào",notes:["Tế bào là đơn vị cơ bản cấu tạo nên cơ thể sống.","Ba thành phần chính: màng tế bào, tế bào chất, nhân (hoặc vùng nhân).","Tế bào nhân sơ (vi khuẩn) chưa có nhân hoàn chỉnh; tế bào nhân thực có nhân hoàn chỉnh. Tế bào thực vật có lục lạp và thành tế bào.","Tế bào lớn lên và sinh sản: 1 tế bào phân chia thành 2 tế bào."]},
    {id:"k18",group:K5,short:"Bài 18",name:"Thực hành quan sát tế bào sinh vật",notes:["Tế bào kích thước lớn (tép bưởi, tép cam) có thể quan sát bằng mắt thường hoặc kính lúp; tế bào biểu bì vảy hành cần kính hiển vi.","Làm tiêu bản: lấy mẫu thật mỏng → đặt lên giọt nước trên lam kính → đậy lamen → quan sát từ vật kính có độ phóng đại nhỏ đến lớn."]},
    {id:"k19",group:K5,short:"Bài 19",name:"Cơ thể đơn bào và cơ thể đa bào",notes:["Cơ thể đơn bào gồm một tế bào (vi khuẩn, trùng roi, trùng giày, tảo lục đơn bào…).","Cơ thể đa bào gồm nhiều tế bào (cây xanh, con người, động vật…).","Các cấp độ tổ chức của cơ thể đa bào: tế bào → mô → cơ quan → hệ cơ quan → cơ thể."]},
    {id:"k35",group:K6,short:"Bài 35",name:"Lực và biểu diễn lực",notes:["Lực là sự đẩy hoặc kéo của vật này lên vật khác. Đơn vị lực là niutơn (N); dụng cụ đo là lực kế.","Biểu diễn lực bằng mũi tên: gốc là điểm đặt; phương, chiều là phương, chiều của lực; độ dài biểu thị độ lớn theo tỉ xích."]},
    {id:"k36",group:K6,short:"Bài 36",name:"Tác dụng của lực",notes:["Lực có thể làm thay đổi tốc độ, hướng chuyển động của vật (bắt đầu chuyển động, nhanh lên, chậm lại, dừng lại, đổi hướng).","Lực có thể làm vật bị biến dạng.","Một lực có thể vừa làm biến đổi chuyển động vừa làm biến dạng vật."]}

function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=hash(String(seed));return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffleWith(arr,r){arr=arr.slice();for(let i=arr.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function apportion(sizes,n){
  const total=Object.values(sizes).reduce((a,b)=>a+b,0), out={}, rem=[];let used=0;
  for(const [k,c] of Object.entries(sizes)){const x=n*c/total;out[k]=Math.floor(x);used+=out[k];rem.push([x-out[k],k])}
  rem.sort((a,b)=>b[0]-a[0]);for(let i=0;used<n&&rem.length;i++,used++)out[rem[i%rem.length][1]]++;
  return out;
}
const NB=" ";
function fmt(n){const neg=n<0, a=Math.abs(n), s=String(a);return (neg?"−":"")+(a>=10000?s.replace(/\B(?=(\d{3})+(?!\d))/g,NB):s)}
const DIG=["không","một","hai","ba","bốn","năm","sáu","bảy","tám","chín"];
function read3(n,full){
  const h=Math.floor(n/100), t=Math.floor(n/10)%10, u=n%10, w=[];
  if(full||h>0)w.push(DIG[h],"trăm");
  if(t===0){if(u>0){if(full||h>0)w.push("linh");w.push(DIG[u])}}
  else if(t===1){w.push("mười");if(u===5)w.push("lăm");else if(u>0)w.push(DIG[u])}
  else{w.push(DIG[t],"mươi");if(u===1)w.push("mốt");else if(u===5)w.push("lăm");else if(u>0)w.push(DIG[u])}
  return w.join(" ");
}
function docSo(n){
  if(n===0)return "không";
  const units=["","nghìn","triệu","tỉ"], g=[];let x=n;
  while(x>0){g.push(x%1000);x=Math.floor(x/1000)}
  const out=[];
  for(let i=g.length-1;i>=0;i--){if(g[i]===0)continue;out.push(read3(g[i],i!==g.length-1));if(units[i])out.push(units[i])}
  return out.join(" ");
}
function roman(n){const m=[[1000,"M"],[900,"CM"],[500,"D"],[400,"CD"],[100,"C"],[90,"XC"],[50,"L"],[40,"XL"],[10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]];let s="";for(const [v,c] of m)while(n>=v){s+=c;n-=v}return s}

function one(src,r){

  return {kind:"fill",q:src.q,ans:String(src.ans).split("|"),cs:!!src.cs,x:src.x};
}
function inst(it,r){
  if(it.rd)return it.qs.map((sq,k)=>Object.assign(one(sq,r),{id:it.id,sub:k,sid:it.sid,l:it.l,passage:it.rd,ptitle:it.t}));

}
const permCache={};
function perm(key,len){return permCache[key]||(permCache[key]=shuffleWith([...Array(len).keys()],rng(key)))}
function scopeOf(s,id){const sc=s.test.scopes;return sc.find(x=>x.id===id)||sc[0]}
const inScope=(sc,l)=>sc.lessons==="*"||sc.lessons.includes(l);
function buildTest(sid,scopeId,k){
  const s=SUBJ[sid], T=s.test, sc=scopeOf(s,scopeId), base=[APP.key,sid,sc.id].join("|");
  const items=s.items.filter(it=>inScope(sc,it.l));
  const rds=items.filter(it=>it.rd), norm=items.filter(it=>!it.rd), out=[];
  if(T.reading&&rds.length){const cyc=Math.floor(k/rds.length), it=rds[perm(base+"|rd|"+cyc,rds.length)[k%rds.length]];out.push(...inst(it,rng(base+"|"+k+"|"+it.id)))}
  const need=T.n-out.length, g={};
  norm.forEach(it=>(g[it.l]=g[it.l]||[]).push(it));
  const sizes={};for(const l in g)sizes[l]=g[l].length;
  const quota=apportion(sizes,need), picked=[], seen=new Set();
  for(const l in quota){
    const G=g[l], q=Math.min(quota[l],G.length);let pos=k*quota[l], got=0, guard=0;
    while(got<q&&guard++<G.length*3){const cyc=Math.floor(pos/G.length), it=G[perm(base+"|"+l+"|"+cyc,G.length)[pos%G.length]];if(!seen.has(it.id)){seen.add(it.id);picked.push(it);got++}pos++}
  }
  if(picked.length<need){const rest=shuffleWith(norm.filter(it=>!seen.has(it.id)),rng(base+"|top|"+k));while(picked.length<need&&rest.length)picked.push(rest.shift())}
  shuffleWith(picked,rng(base+"|order|"+k)).forEach(it=>out.push(...inst(it,rng(base+"|"+k+"|"+it.id))));
  return out;
}

  return out;
}

function startWrong(sid){const keys=[...wrongOf(sid)];const qs=shuffleWith(keys,Math.random).flatMap(k=>byKey(sid,k));start({mode:"practice",sid,qs,label:`${SUBJ[sid].name} · Ôn câu sai`})}
function updTimer(left){const el=$("#timer");if(!el)return;el.textContent=fmtTime(left);el.classList.toggle("warn",left<180)}

function passageHTML(t){return t.split(/\n\s*\n/).map(p=>p.includes("\n")?`<p class="poem">${nbNum(esc(p.trim()))}</p>`:`<p>${nbNum(esc(p.trim()))}</p>`).join("")}
function renderQ(){
  const q=S.qs[S.i], n=S.qs.length, exam=S.mode==="exam", s=SUBJ[S.sid], L=s.L[q.l];
  S.cur=null;S.checked=false;
  topRight.innerHTML=(S.limit?`<span class="chip" id="timer" aria-label="Thời gian còn lại"></span>`:"")+`<span class="chip">${S.i+1} / ${n}</span>`;
  if(S.limit)updTimer(S.limit-(Date.now()-S.start)/1000);
  let body="";
  if(q.kind==="mc"){
    const wide=q.o.some(o=>stripTags(o).length>24);
    body=`<div class="label">${q.tf?"Đúng hay sai?":"Chọn đáp án đúng"}</div><div class="qtext">${nbNum(q.q)}</div>
      <div class="opts${wide?" wide":""}">${q.order.map((oi,k)=>`<button class="opt" data-o="${oi}"><span class="k">${q.tf?"":"ABCD"[k]}</span><span>${nbNum(q.o[oi])}</span></button>`).join("")}</div>`;
  }else{
    const numeric=q.ans.every(a=>isNum(a)&&!/^[-−]/.test(a.trim())), neg=q.ans.some(a=>/^[-−]/.test(a.trim()));
    const inp=`<input class="blank${q.q.includes("___")?"":" wide"}" id="fillIn" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="${numeric?"numeric":"text"}" aria-label="Câu trả lời">`;
    body=`<div class="label">Điền vào chỗ trống</div>`+(q.q.includes("___")?`<div class="qtext">${nbNum(q.q).replace("___",inp)}</div>`:`<div class="qtext">${nbNum(q.q)}</div>${inp}`)
      +(neg?`<div class="hint">Số âm: gõ dấu trừ phía trước, ví dụ -12.</div>`:q.cs?`<div class="hint">Chú ý viết hoa đúng quy tắc.</div>`:"");
  }
  view.innerHTML=`<div class="stack">
    <div class="bar" aria-hidden="true"><i style="width:${S.i/n*100}%"></i></div>
    <section class="qcard">
      <div class="qhead"><span class="label">${esc(S.label)}</span><span class="label">${esc(L?L.short:"")}</span></div>
      ${q.passage?`<details class="passage" open><summary>Đọc văn bản: ${nbNum(esc(q.ptitle||""))}</summary><div class="ptext">${passageHTML(q.passage)}</div></details>`:""}
      ${body}
      <div id="fb" aria-live="polite"></div>
    </section>
    <div class="actions"><button class="btn ghost" id="skipBtn">Bỏ qua</button><button class="btn main" id="goBtn">${exam?"Trả lời":"Kiểm tra"}</button></div>
    <div id="endArea"></div>
  </div>`;
  drawEnd();
  if(q.kind==="mc")view.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(S.checked)return;view.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");S.cur=+b.dataset.o});
  else{const inp=$("#fillIn");inp.oninput=()=>S.cur=inp.value;inp.onkeydown=e=>{if(e.key==="Enter")$("#goBtn").click()};setTimeout(()=>inp.focus({preventScroll:true}),60)}
  $("#skipBtn").onclick=()=>{record(q,null);next()};
  $("#goBtn").onclick=()=>{
    if(S.checked){next();return}
    if(S.cur==null||S.cur===""){$("#fb").innerHTML=`<div class="fb bad">Bạn hãy trả lời trước, hoặc bấm Bỏ qua.</div>`;return}
    const ok=record(q,S.cur);
    if(S.mode==="exam"){next();return}
    S.checked=true;
    if(q.kind==="mc")view.querySelectorAll(".opt").forEach(b=>{const o=+b.dataset.o;if(o===q.a)b.classList.add("right");else if(b.classList.contains("sel"))b.classList.add("wrong")});
    $("#fb").innerHTML=(ok?`<div class="fb ok">Chính xác!</div>`:`<div class="fb bad">Chưa đúng. <span>Đáp án: <b>${nbNum(q.kind==="mc"?q.o[q.a]:esc(showAns(q)))}</b></span></div>`)+(q.x?`<div class="expl">${nbNum(q.x)}</div>`:"");
    $("#goBtn").textContent=S.i+1<n?"Câu tiếp":"Xem kết quả";$("#skipBtn").disabled=true;
  };
}
function drawEnd(){
  const exam=S.mode==="exam";
  $("#endArea").innerHTML=`<button class="btn ghost small" id="endBtn">${exam?"Nộp bài sớm":"Dừng luyện tập"}</button>`;
  $("#endBtn").onclick=()=>{
    $("#endArea").innerHTML=`<div class="confirm"><div>${exam?"Nộp bài ngay? Các câu chưa làm sẽ tính là sai.":"Dừng luyện tập và xem kết quả?"}</div><div class="row"><button class="btn danger" id="yesEnd">${exam?"Nộp bài":"Dừng"}</button><button class="btn ghost" id="noEnd">Làm tiếp</button></div></div>`;
    $("#yesEnd").onclick=finish;$("#noEnd").onclick=drawEnd;
  };
}
function record(q,g){
  const ok=isRight(q,g), w=wrongOf(S.sid);
  S.ans[S.i]={q,g,ok};
  if(ok)w.delete(wkey(q));else w.add(wkey(q)); // L27: làm đúng ở bất kì chế độ nào (cả đề thi thử) thì bỏ câu khỏi "Ôn câu sai"
  saveWrong(S.sid,w);return ok;
}
function next(){S.i++;if(S.i>=S.qs.length)finish();else renderQ()}
function finish(){
  if(!S)return;clearInterval(tick);
  const secs=Math.min((Date.now()-S.start)/1000,S.limit||Infinity), s=SUBJ[S.sid];
  if(S.mode==="exam"){const w=wrongOf(S.sid);for(let i=0;i<S.qs.length;i++)if(!S.ans[i]){S.ans[i]={q:S.qs[i],g:null,ok:false};w.add(wkey(S.qs[i]))}saveWrong(S.sid,w)}
  const done=S.ans.filter(Boolean), right=done.filter(a=>a.ok).length, total=done.length;
  if(S.test){const key=rkey(S.test.sid,S.test.sc,S.test.k), prev=res[key];res[key]={b:Math.max(right,prev?prev.b:0),l:right,t:total};store.set("res",res)}
  if(S.lesson&&total){lres[S.sid+"|"+S.lesson]={r:right,t:total};store.set("lres",lres)}
  hist.unshift({d:new Date().toISOString(),sid:S.sid,l:S.label,r:right,t:total,s:Math.round(secs)});hist=hist.slice(0,30);store.set("hist",hist);
  window.ontapReport&&ontapReport({label:S.label,mode:S.mode,subject:S.sid,r:right,t:total,s:Math.round(secs)});
  const pct=total?right/total:0;
  const msg=pct>=.9?"Xuất sắc! Bạn đã nắm rất chắc phần này.":pct>=.75?"Tốt lắm! Xem lại các câu sai để chắc chắn hơn.":pct>=.5?"Khá ổn. Bạn đọc lại phần ghi nhớ của các bài còn yếu rồi luyện lại nhé.":"Cố lên! Bạn ôn lại từng bài trong mục Ôn theo bài rồi làm lại.";
  const by={};done.forEach(a=>{by[a.q.l]=by[a.q.l]||[0,0];by[a.q.l][1]++;if(a.ok)by[a.q.l][0]++});
  const order=s.lessons.map(l=>l.id).filter(id=>by[id]);
  const wrong=done.filter(a=>!a.ok), test=S.test, lesson=S.lesson, sid=S.sid, w=wrongOf(sid);
  topRight.innerHTML="";
  view.innerHTML=`<div class="stack">
    <section class="panel">
      <div class="label">${esc(S.label)}</div>
      <div class="row" style="gap:18px;align-items:flex-end"><div class="score">${diem10(right,total)}<span style="font-size:1.4rem;color:var(--muted)">/10</span></div>
      <div class="stack" style="gap:2px"><b>${right}/${total} câu đúng</b><span class="muted small">Thời gian: ${fmtTime(secs)}</span></div></div>
      <div>${msg}</div>
    </section>
    ${order.length>1?`<section class="panel"><div class="label">Theo bài</div><div class="ubreak">${order.map(id=>{const [r,t]=by[id];return `<span>${esc(s.L[id].short)}</span><div class="bar"><i style="width:${r/t*100}%"></i></div><span>${r}/${t}</span>`}).join("")}</div></section>`:""}
    ${wrong.length?`<section class="panel"><div class="label">Câu cần xem lại (${wrong.length})</div><div class="review">${wrong.map(a=>`<div class="rv">${a.q.ptitle?`<div class="small muted">Văn bản: ${nbNum(esc(a.q.ptitle))}</div>`:""}<div>${nbNum(a.q.q).replace("___","…")}</div><div class="ans">Bạn trả lời: <s>${nbNum(a.q.kind==="mc"&&a.g!=null?a.q.o[a.g]:esc(givenText(a.q,a.g)))}</s> · Đáp án: <b>${nbNum(a.q.kind==="mc"?a.q.o[a.q.a]:esc(showAns(a.q)))}</b></div>${a.q.x?`<div class="expl">${nbNum(a.q.x)}</div>`:""}</div>`).join("")}</div></section>`:""}
    ${!wrong.length&&total&&w.size?`<p class="muted small" id="wrongNote" style="margin:0">Lần này bạn không sai câu nào. Danh sách Ôn câu sai còn ${w.size} câu từ các lần làm trước.</p>`:""}
    <div class="row" id="resBtns"></div>
  </div>`;
  const btns=$("#resBtns"), add=(cls,txt,fn)=>{const b=document.createElement("button");b.className="btn "+cls;b.textContent=txt;b.onclick=fn;btns.append(b)};
  if(test){const nk=nextTest(sid);if(nk!=null)add("main",`Làm Đề ${nk+1}`,()=>startTest(sid,nk))}
  if(lesson)add("main","Luyện lại bài này",()=>startLesson(sid,lesson));
  if(w.size)add("","Ôn câu sai ("+w.size+")",()=>startWrong(sid));
  add("ghost","Trang chủ",()=>renderHome());
  S=null;window.scrollTo(0,0);
}

function renderHome(){
  clearInterval(tick);S=null;topRight.innerHTML="";
  const s=SUBJ[cur];setTone(cur);store.set("sub",cur);
  const T=s.test, sc=scopeSel(cur), nk=nextTest(cur), nl=nextLesson(s), w=wrongOf(cur);
  const groups=[];s.lessons.forEach(l=>{let g=groups.find(x=>x.name===l.group);if(!g)groups.push(g={name:l.group,ls:[]});g.ls.push(l)});
  const h=hist.filter(x=>x.sid===cur).slice(0,10);
  view.innerHTML=`<div class="stack">
    <div class="subtabs" role="group" aria-label="Chọn môn">${APP.subjects.map(x=>`<button class="stab" data-sid="${x.id}" aria-pressed="${x.id===cur}">${esc(x.name)}</button>`).join("")}</div>
    <section class="hero">
      <span class="label">${esc(APP.examText)}</span>
      <h1>${esc(s.name)} ${APP.grade}</h1>
      <p>${s.scopeText}</p>
      <div class="row">${nl?`<button class="btn main" id="heroLesson">Ôn tập: ${esc(nl.short)}</button>`:""}${nk!=null?`<button class="btn ghost" id="heroTest">Làm Đề ${nk+1}</button>`:""}</div>
    </section>
    <section class="sec"><h2>Ôn theo bài</h2><p class="muted small">Đọc phần ghi nhớ, rồi luyện tập. Làm xong mỗi câu sẽ biết đúng sai và có giải thích.</p>
      ${groups.map(g=>`<div class="grp"><div class="grp-h">${esc(g.name)}</div><div class="lessons">${g.ls.map(l=>{const r=lres[cur+"|"+l.id];
        return `<button class="lrow" data-l="${l.id}"><span class="lnum">${esc(l.short)}</span><span class="lname">${nbNum(esc(l.name))}</span><span class="lmeta${r?(r.r/r.t>=.8?" good":" fair"):""}">${r?`${r.r}/${r.t}`:`${l.count} câu`}</span></button>`}).join("")}</div></div>`).join("")}
    </section>
    <section class="sec"><h2>Đề thi thử giữa kì</h2>
      <p class="muted small">${T.count} đề, mỗi đề ${T.n} câu, làm trong ${T.mins} phút. Mỗi đề cố định, làm lại vẫn ra đúng các câu đó${s.items.some(it=>it.g)?" (riêng câu tính toán có thể đổi số liệu theo từng đề)":""}. Đáp án hiện sau khi nộp bài.</p>
      ${T.scopes.length>1?`<div class="seg" role="group" aria-label="Phạm vi đề">${T.scopes.map(x=>`<button data-sc="${x.id}" aria-pressed="${x.id===sc}">${esc(x.name)}<small>${esc(x.note||"")}</small></button>`).join("")}</div>`:""}
      <div class="legend"><span><i style="background:var(--ok)"></i>Từ 8 điểm</span><span><i style="background:var(--sun)"></i>Dưới 8 điểm</span><span><i style="background:var(--line)"></i>Chưa làm</span></div>
      <div class="tests">${[...Array(T.count).keys()].map(k=>{const r=res[rkey(cur,sc,k)];const cls=r?(r.b/r.t>=.8?"good":"fair"):"";
        return `<button class="tb ${cls}${k===nk?" next":""}" data-k="${k}" aria-label="Đề ${k+1}${r?", điểm cao nhất "+diem10(r.b,r.t):""}"><b>Đề ${k+1}</b><small>${r?diem10(r.b,r.t)+"đ":"–"}</small></button>`}).join("")}</div>
    </section>
    ${s.writing&&s.writing.length?`<section class="sec"><h2>Luyện viết</h2><p class="muted small">Phần viết không chấm tự động. Bạn đọc đề, xem gợi ý dàn ý, viết bài rồi tự kiểm tra theo danh sách.</p>
      <div class="wlist">${s.writing.map((x,i)=>`<button class="wrow" data-w="${i}"><b>${esc(x.title)}</b><span class="small muted">${esc(x.prompt)}</span></button>`).join("")}</div></section>`:""}
    <section class="sec"><h2>Ôn câu sai</h2>
      <div class="panel"><div>${w.size?`Có <b>${w.size}</b> câu bạn từng làm sai ở môn ${esc(s.name)}. Làm đúng câu đó ở bất kì phần nào (ôn theo bài, đề thi thử hay ôn câu sai) thì câu được bỏ khỏi danh sách.`:"Chưa có câu sai nào ở môn này."}</div>
      ${w.size?`<div class="row"><button class="btn" id="wrongBtn">Ôn ${w.size} câu sai</button></div>`:""}</div>
    </section>
    <section class="sec"><h2>Lịch sử làm bài</h2>
      <div class="panel">${h.length?`<div class="hist">${h.map(x=>`<div><span>${fmtDate(new Date(x.d))} · ${esc(x.l)}</span><b>${diem10(x.r,x.t)}đ · ${x.r}/${x.t}</b></div>`).join("")}</div>`:`<span class="muted">Kết quả các lần làm bài sẽ hiện ở đây (lưu trên máy này).</span>`}</div>
    </section>
    <p class="muted small foot">${APP.footer}</p>
  </div>`;
  view.querySelectorAll(".stab").forEach(b=>b.onclick=()=>{cur=b.dataset.sid;renderHome()});
  if($("#heroLesson"))$("#heroLesson").onclick=()=>renderLesson(cur,nl.id);
  if($("#heroTest"))$("#heroTest").onclick=()=>startTest(cur,nk);
  view.querySelectorAll(".lrow").forEach(b=>b.onclick=()=>renderLesson(cur,b.dataset.l));
  view.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{store.set("scope_"+cur,b.dataset.sc);renderHome()});
  view.querySelectorAll(".tb").forEach(b=>b.onclick=()=>startTest(cur,+b.dataset.k));
  view.querySelectorAll(".wrow").forEach(b=>b.onclick=()=>renderWriting(cur,+b.dataset.w));
  if($("#wrongBtn"))$("#wrongBtn").onclick=()=>startWrong(cur);
}
function renderLesson(sid,l){
  clearInterval(tick);S=null;topRight.innerHTML="";
  const s=SUBJ[sid], L=s.L[l], r=lres[sid+"|"+l];
  view.innerHTML=`<div class="stack">
    <button class="back" id="backBtn">‹ ${esc(s.name)}</button>
    <div class="label">${esc(L.group)}</div>
    <h2>${esc(L.short)}. ${nbNum(esc(L.name))}</h2>
    <section class="panel notes"><h3>Ghi nhớ</h3><ul>${L.notes.map(n=>`<li>${nbNum(n)}</li>`).join("")}</ul></section>
    <div class="row"><button class="btn main" id="goBtn">Luyện tập ${L.count} câu</button>${r?`<span class="muted small">Lần trước: ${r.r}/${r.t} câu đúng</span>`:""}</div>
    ${L.hasGen?`<p class="muted small" style="margin:0">Các câu tính toán đổi số liệu mỗi lần làm, nên bạn có thể luyện lại nhiều lần.</p>`:""}
  </div>`;
  $("#backBtn").onclick=()=>renderHome();
  $("#goBtn").onclick=()=>startLesson(sid,l);
  window.scrollTo(0,0);
}
function renderWriting(sid,i){
  clearInterval(tick);S=null;topRight.innerHTML="";
  const s=SUBJ[sid], W=s.writing[i], ck=store.get("wchk_"+sid+i,[]), draft=store.get("wdraft_"+sid+i,"");
  view.innerHTML=`<div class="stack">
    <button class="back" id="backBtn">‹ ${esc(s.name)}</button>
    <div class="label">Luyện viết</div>
    <h2>${esc(W.title)}</h2>
    <section class="panel"><div class="label">Đề bài</div><div>${esc(W.prompt)}</div></section>
    <section class="panel"><details class="outline"><summary>Gợi ý dàn ý</summary><ol>${W.outline.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></details></section>
    <section class="panel"><div class="label">Bài viết của bạn</div>
      <textarea id="draft" aria-label="Bài viết" placeholder="Bạn viết bài vào đây. Bài được lưu tự động trên máy này.">${esc(draft)}</textarea>
      <div class="muted small" id="wc"></div></section>
    <section class="panel"><div class="label">Tự kiểm tra</div>${W.checklist.map((c,j)=>`<label class="check"><input type="checkbox" id="ck${j}" data-j="${j}" ${ck.includes(j)?"checked":""}><span>${esc(c)}</span></label>`).join("")}</section>
  </div>`;
  const ta=$("#draft"), wc=$("#wc");
  const count=()=>{const n=ta.value.trim()?ta.value.trim().split(/\s+/).length:0;wc.textContent=n+" chữ"};
  count();let t;ta.oninput=()=>{count();clearTimeout(t);t=setTimeout(()=>store.set("wdraft_"+sid+i,ta.value),400)};
  view.querySelectorAll(".check input").forEach(c=>c.onchange=()=>{const v=[...view.querySelectorAll(".check input")].filter(x=>x.checked).map(x=>+x.dataset.j);store.set("wchk_"+sid+i,v)});
  $("#backBtn").onclick=()=>renderHome();
  window.scrollTo(0,0);
}
$("#homeBtn").onclick=()=>{if(S){const b=$("#endBtn");if(b)b.click();return}renderHome()};
renderHome();
})()}

</script>

</body></html>
