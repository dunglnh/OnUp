:root[data-theme="dark"]{

.stack{display:flex;flex-direction:column;gap:14px}

.tb{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 0;display:flex;flex-direction:column;align-items:center;line-height:1.15;font-variant-numeric:tabular-nums;min-width:0}

.unit .t{font-size:.9rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}

.small{font-size:.875rem}
.hist{display:flex;flex-direction:column}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:.9rem;font-variant-numeric:tabular-nums}
.hist div:first-child{border-top:0}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--sun);transition:width .3s}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px 18px;display:flex;flex-direction:column;gap:16px}
.qhead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.qtext{font-size:1.2rem;font-weight:600;min-width:0;overflow-wrap:anywhere}
.qtext .pic{font-size:2.6rem;line-height:1;display:block;margin-bottom:6px}
.qtext u,.opt u{text-decoration-thickness:2px;text-underline-offset:3px;color:var(--sea);font-weight:700}
.qtext sub{font-size:.8125rem;font-weight:800;color:var(--sea);margin-left:1px}
.read{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 14px;line-height:1.6;overflow-wrap:anywhere}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.wide{grid-template-columns:1fr}

.opt{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:1.05rem;display:flex;gap:10px;align-items:baseline;min-width:0;overflow-wrap:anywhere}
.opt .k{font-weight:800;color:var(--muted)}
.opt.sel{border-color:var(--pick);background:var(--pick-soft)}

.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.blank{font:inherit;font-weight:700;border:0;border-bottom:3px solid var(--pick);background:var(--pick-soft);color:var(--ink);border-radius:6px 6px 0 0;padding:2px 6px;width:9em;max-width:100%;text-align:center}
.letter{width:1.4em;padding:2px 0;text-transform:lowercase;margin:0 1px}
.word{font-size:1.6rem;letter-spacing:.06em}
.slot{min-height:56px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pool{display:flex;flex-wrap:wrap;gap:8px}

.tile.ch{min-width:2.4em;font-size:1.25rem;padding:4px 10px}
.tile.used{visibility:hidden}

.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb span{color:var(--ink);font-weight:500}

pre.fmt{margin:0;white-space:pre-wrap;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border-radius:10px;padding:10px 12px;overflow-x:auto}

.confirm{border:2px solid var(--bad);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}

.opt.picopt{justify-content:center;align-items:center;font-size:2.4rem;line-height:1.1;padding:12px}

/* Phiên 9o (L38, L39): nút mở bảng số câu cạnh thanh tiến độ (X26: số câu rời thanh trên), bảng số câu, chú thích, màn "Xem lại bài làm";
   số đo chép từ .qz-* của css/app.css (Phiên 9n, 9nb); ô đã trả lời dùng --pick như ô đang chọn, không theo màu của môn */
.qtop{display:flex;align-items:center;gap:10px}
.qtop .bar{flex:1;min-width:0}
.gbtn{display:inline-flex;align-items:center;gap:2px;min-height:44px;padding:7px 6px 7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}
.gbtn svg{color:var(--sea);flex:none}

.qgrid{gap:12px}

.qz-cell{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;height:48px;min-height:48px;padding:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;color:var(--ink);font-weight:700;line-height:1.1}
.qz-cell i{font-style:normal;font-size:13px;line-height:1;min-height:13px;color:var(--muted)}
.qz-cell.st-skip{border:2px dashed var(--muted)}
.qz-cell.st-ans{border:2px solid var(--pick);background:var(--pick-soft)}
.qz-cell.st-ok{border:2px solid var(--ok);background:var(--ok-soft)} .qz-cell.st-ok i{color:var(--ok)}
.qz-cell.st-bad{border:2px solid var(--bad);background:var(--bad-soft)} .qz-cell.st-bad i{color:var(--bad)}
.qz-cell.cur{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.qz-key{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0;font-size:13px}

.qz-key .qz-cell.cur{box-shadow:0 0 0 1px var(--surface),0 0 0 2px var(--ink)}

.recap+.actions .btn{padding-left:12px;padding-right:12px}
.qleft{align-self:flex-start;background:var(--sun-soft);color:var(--ink);border-radius:6px;padding:2px 8px;font-size:.8125rem;font-weight:700} /* nhãn "Câu còn trống 2/3" đầu thẻ câu trong vòng làm tiếp */
.actions>.btn.main{margin-left:auto} /* câu mở lại không có "Bỏ qua": nút chính vẫn ở mép phải */
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const PROMPT={o:"Choose the odd one out.",p:"Choose the word whose underlined part is pronounced differently."};
function toQ(row,lv,i){
  const [t,u]=row, id=lv+i, q={id,lv,t,u};
  if(t==="m"){const m=row[2].match(/^\{(.+?)\}(.*)$/);if(m){q.pic=m[1];q.q=m[2]}else q.q=row[2];q.o=row.slice(3);q.a=0}
  else if(t==="o"||t==="p"){q.q=PROMPT[t];q.o=row.slice(2);q.a=0}
  else if(t==="rd"){q.read=row[2];q.q=row[3];q.o=row.slice(4);q.a=0}
  else if(t==="e"){q.s=row[2];q.a=row[3];q.fix=row[4];q.parts=[...row[2].matchAll(/\[([^\]]+)\]/g)].map(m=>m[1])}
  else if(t==="f"){q.q=row[2];q.ans=row[3].split("|")}
  else if(t==="l"||t==="w"){q.w=row[2];q.h=row[3]}
  else if(t==="r"){q.s=row[2]}
  else if(t==="h"){q.say=row[2];q.q=row[3]||"Listen and choose the right answer.";q.o=row.slice(4);q.a=0}
  else if(t==="hp"){q.say=row[2];q.q="Listen and choose the right picture.";q.o=row.slice(3);q.a=0;q.pics=true}
  else if(t==="hf"){q.say=row[2];q.q=row[3];q.ans=row[4].split("|")}

}

function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=hash(String(seed));return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffleWith(arr,r){arr=arr.slice();for(let i=arr.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function apportion(sizes,n){
  const total=Object.values(sizes).reduce((a,b)=>a+b,0), out={}, rem=[];let used=0;
  for(const [k,c] of Object.entries(sizes)){const x=n*c/total;out[k]=Math.floor(x);used+=out[k];rem.push([x-out[k],k])}
  rem.sort((a,b)=>b[0]-a[0]);for(let i=0;used<n;i++,used++)out[rem[i%rem.length][1]]++;
  return out;
}
const groupCache={};
function groups(bank,noListen){
  const ck=bank+(noListen?"-r":"");
  if(groupCache[ck])return groupCache[ck];
  const g={};BANKS[bank].forEach(q=>{const t=q.say?"L":q.t;if(noListen&&t==="L")return;(g[t]=g[t]||[]).push(q)});
  return groupCache[ck]=g;
}
const permCache={};
function perm(track,bank,t,cycle,len){
  const k=[track,bank,t,cycle].join(":");
  return permCache[k]||(permCache[k]=shuffleWith([...Array(len).keys()],rng(k)));
}
function buildTest(trackKey,k,noListen){
  const T=TRACKS[trackKey], picked=[], seen=new Set();
  for(const [bank,n] of T.pools){
    const g=groups(bank,noListen), sizes={};for(const t in g)sizes[t]=g[t].length;
    const quota=apportion(sizes,n);
    for(const t in quota){
      const G=g[t], q=Math.min(quota[t],G.length);let pos=k*quota[t], got=0, guard=0;
      while(got<q&&guard++<G.length*3){
        const cyc=Math.floor(pos/G.length), item=G[perm(trackKey,bank,t,cyc,G.length)[pos%G.length]];
        if(!seen.has(item.id)){seen.add(item.id);picked.push(item);got++}
        pos++;
      }
    }
  }
  const order=shuffleWith(picked,rng(trackKey+"-order-"+k));
  return order.map(q=>inst(q,trackKey+"-"+k+"-"+q.id));
}

/* Make a playable copy: shuffled options, shuffled tiles, chosen missing letters */
const chunks=s=>s.split("/").map(x=>x.trim()).filter(Boolean);
function inst(q,seed){
  const r=seed==null?Math.random:rng(seed), x={...q};
  if(x.o){x.order=shuffleWith(x.o.map((_,i)=>i),r)}
  if(x.t==="r"||x.t==="w"){
    const parts=x.t==="r"?chunks(x.s):[...x.w];
    const c=parts.map((c,i)=>({c,i}));let s=c;
    for(let n=0;n<8;n++){s=shuffleWith(c,r);if(s.map(t=>t.c).join("|")!==parts.join("|"))break}
    x.tiles=s;
  }
  if(x.t==="l"){
    const idx=[...x.w].map((ch,i)=>/[a-z]/i.test(ch)?i:-1).filter(i=>i>=0);
    const n=TWO_LETTER_LEVELS.includes(x.lv)&&x.w.length>=7?2:1;
    x.miss=shuffleWith(idx,r).slice(0,n).sort((a,b)=>a-b);
  }
  return x;
}

function wireQ(q,reopen){

function isRight(q,given){
  if(given==null)return false;
  if(q.o||q.t==="e")return given===q.a;
  if(q.ans)return q.ans.some(a=>norm(a)===norm(given));
  if(q.t==="l")return q.miss.every((p,j)=>norm(given[j])===q.w[p].toLowerCase());
  if(q.t==="w")return given.map(k=>q.tiles[k].c).join("")===q.w;
  return given.map(k=>q.tiles[k].c).join(" ")===chunks(q.s).join(" ");
}
function givenText(q,given){
  if(given==null)return "(no answer)";
  if(q.o)return strip(q.o[given]);
  if(q.t==="e")return `${LETTERS[given]} (${q.parts[given]})`;
  if(q.t==="r")return given.map(k=>q.tiles[k].c).join(" ");
  if(q.t==="w")return given.map(k=>q.tiles[k].c).join("");
  if(q.t==="l"){let j=0;return [...q.w].map((c,i)=>q.miss.includes(i)?(given[j++]||"_"):c).join("")}
  return String(given);
}
function record(q,given){
  const ok=isRight(q,given);
  S.ans[S.i]={q,given,ok};
  if(ok)wrongIds.delete(q.id);else wrongIds.add(q.id); // L27: a correct answer in any mode (tests too) removes the question from the review list
  saveWrong();return ok;
}
function showFeedback(q,ok){
  if(q.o||q.t==="e")view.querySelectorAll(".opt").forEach(b=>{const o=+b.dataset.o;if(o===q.a)b.classList.add("right");else if(b.classList.contains("sel"))b.classList.add("wrong")});

}
// đi tiếp: câu kế tiếp theo nextIdx; hết thì về màn "Review your answers"; luyện tập không còn câu trống thì ra kết quả như trước
function next(){const j=nextIdx();if(j>=0){S.i=j;renderQ();return}if(S.mode!=="exam"&&!blanks().length){finish();return}recap()}

      <div class="stack" style="gap:2px"><b>${pct}% correct</b><span class="muted small">Time: ${fmtTime(secs)}</span></div></div>

    ${total?`<section class="panel"><div class="label">By unit</div><div class="ubreak">${Object.keys(units).sort((a,b)=>a-b).map(k=>{const [r,t]=units[k];return `<span>${+k?"Unit "+k:"My Questions"}</span><div class="bar"><i style="width:${r/t*100}%"></i></div><span>${r}/${t}</span>`}).join("")}</div></section>`:""}
    ${wrong.length?`<section class="panel"><div class="label">Questions to review (${wrong.length})</div><div class="review">${wrong.map(a=>`<div class="rv"><div>${stemText(a.q)}</div><div class="ans">Your answer: <s>${esc(givenText(a.q,a.given))}</s> · Correct: <b>${esc(correctText(a.q))}</b></div></div>`).join("")}</div></section>`:""}
    ${!wrong.length&&total&&wrongIds.size?`<p class="muted small" id="wrongNote" style="margin:0">No mistakes this time. Your review list still has ${wrongIds.size} question${wrongIds.size>1?"s":""} from earlier.</p>`:""}
    <div class="row" id="resBtns"></div>
  </div>`;

}

function drawWeeks(){

      <div class="tests">${[...Array(PER_WEEK).keys()].map(d=>{const k=w*PER_WEEK+d, r=results[resKey(tab,k)];

/* ================= Import ================= */
const SAMPLE=`# Unit 1
Where ___ you from?
* are
- is
- am
- do

I'm [from] Viet Nam.

>> She / is / from / Japan.

# Unit 2
Choose the odd one out.
* bedroom
- breakfast
- lunch
- dinner`;
function parse(text){
  const out=[], errs=[];let unit=null;
  text.replace(/\r/g,"").split(/\n\s*\n/).forEach((blk,bi)=>{
    let lines=blk.split("\n").map(l=>l.trim()).filter(Boolean);
    while(lines.length&&lines[0].startsWith("#")){const m=lines[0].match(/(\d+)/);unit=m?+m[1]:null;lines.shift()}
    if(!lines.length)return;
    const u=unit&&unit>=1&&unit<=20?unit:null;
    if(lines[0].startsWith(">>")){const s=lines[0].slice(2).trim();if(chunks(s).length<2){errs.push(`Block ${bi+1}: a reorder question needs at least 2 parts separated by /`);return}out.push({u,t:"r",s});return}
    const opts=lines.filter(l=>/^[*-]\s*/.test(l));
    if(opts.length){
      const q=lines.filter(l=>!/^[*-]\s*/.test(l)).join(" ");
      const o=opts.map(l=>l.replace(/^[*-]\s*/,"")), a=opts.findIndex(l=>l.startsWith("*"));
      if(a<0){errs.push(`Block ${bi+1}: mark the correct answer with *`);return}
      if(o.length<2){errs.push(`Block ${bi+1}: add at least 2 answer choices`);return}
      out.push({u,t:"m",q:q||"Choose the best answer.",o,a});return}
    const line=lines.join(" "), m=line.match(/\[([^\]]+)\]/);
    if(m){out.push({u,t:"f",q:line.replace(m[0],"___"),ans:m[1].split("|").map(s=>s.trim()).filter(Boolean)});return}
    errs.push(`Block ${bi+1}: question type not recognised ("${lines[0].slice(0,40)}…")`);
  });
  return {out,errs};
}
function renderImport(){
  topRight.innerHTML="";
  view.innerHTML=`<div class="stack">
    <h2>Add Questions</h2>
    <div class="panel small">
      <div>Leave one empty line between questions. A line like <code># Unit 3</code> labels the questions under it.</div>
      <pre class="fmt">Multiple choice   * correct answer, - wrong answer
Fill in the blank  I'm good [at] Maths.   (more answers: [at|in])
Reorder            >> She / is / my best friend.</pre>
    </div>
    <textarea id="src" placeholder="Paste your questions here…" spellcheck="false" aria-label="Questions"></textarea>
    <div class="row"><button class="btn ghost" id="sampleBtn">Show an example</button><label class="btn ghost" for="fileIn">Open a .txt file</label><input type="file" id="fileIn" accept=".txt,text/plain" hidden></div>
    <div class="row"><button class="btn main" id="parseBtn">Check questions</button><button class="btn ghost" id="cancelBtn">Back</button></div>
    <div id="result"></div>
  </div>`;
  $("#sampleBtn").onclick=()=>$("#src").value=SAMPLE;
  $("#fileIn").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>$("#src").value=r.result;r.readAsText(f,"utf-8")};
  $("#cancelBtn").onclick=()=>renderHome();
  $("#parseBtn").onclick=()=>{
    const {out,errs}=parse($("#src").value);
    const c=t=>out.filter(q=>q.t===t).length;
    $("#result").innerHTML=`<div class="panel">
      <div>Found <b>${out.length}</b> questions: ${c("m")} multiple choice, ${c("f")} fill in the blank, ${c("r")} reorder.</div>
      ${errs.length?`<div class="fb bad small">${errs.map(esc).join("<br>")}</div>`:""}
      ${out.length?`<div class="row"><button class="btn main" id="saveBtn">Save ${out.length} questions</button></div>`:""}
    </div>`;
    if($("#saveBtn"))$("#saveBtn").onclick=()=>{const base=Date.now().toString(36);out.forEach((q,i)=>q.id="M"+base+i);custom=custom.concat(out);store.set("custom",custom);renderHome()};
  };
}
