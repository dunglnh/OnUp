<script>
/* ================= LỚP 4 · Kết nối tri thức với cuộc sống · đến tuần 9 ================= */
const HANG=["đơn vị","chục","trăm","nghìn","chục nghìn","trăm nghìn","triệu","chục triệu","trăm triệu"];
function digitsOf(n){return String(n).split("").map(Number)}
function uniqPos(r,U,n,minP){ // a position (from the right) whose digit is non-zero and appears once
  const d=digitsOf(n).reverse(), cand=[];
  d.forEach((x,p)=>{if(p>=minP&&x>0&&d.filter(y=>y===x).length===1)cand.push(p)});
  return cand.length?U.pick(r,cand):-1;
}
function randNum(r,U,len,zeroRate){let s=String(U.ri(r,1,9));for(let i=1;i<len;i++)s+=r()<zeroRate?"0":String(U.ri(r,0,9));return +s}

const APP={
  key:"gk1-l4-v1", grade:4,
  examText:"Ôn thi giữa học kì I · Kết nối tri thức",
  footer:"Câu hỏi và các đoạn văn đọc hiểu do trang tự soạn theo chương trình sách Kết nối tri thức với cuộc sống, phạm vi đến tuần 9. Đây là trang ôn tập cá nhân. Kết quả được lưu trên máy này.",
  gen:{
    compose5(r,U){const d=[U.ri(r,1,9),U.ri(r,0,9),U.ri(r,0,9),U.ri(r,0,9),U.ri(r,0,9)], nm=["chục nghìn","nghìn","trăm","chục","đơn vị"];
      const parts=d.map((x,i)=>x?`${x} ${nm[i]}`:null).filter(Boolean), n=+d.join("");
      return {q:`Số gồm ${U.joinVN(parts)} viết là: ___`,ans:String(n),x:`Viết lần lượt các chữ số từ hàng chục nghìn đến hàng đơn vị, hàng nào không có thì viết chữ số 0: ${U.fmt(n)}.`}},
    place(r,U){let n,p=-1;while(p<0){n=randNum(r,U,U.pick(r,[5,6]),.15);p=uniqPos(r,U,n,0)}
      const len=String(n).length, d=digitsOf(n).reverse()[p], others=U.shuffle(r,HANG.slice(0,len).filter((_,i)=>i!==p)).slice(0,3);
      return {q:`Trong số ${U.fmt(n)}, chữ số ${d} thuộc hàng nào?`,o:["hàng "+HANG[p],...others.map(h=>"hàng "+h)],x:`Đếm từ phải sang trái: hàng đơn vị, hàng chục, hàng trăm, hàng nghìn, hàng chục nghìn${len>5?", hàng trăm nghìn":""}. Chữ số ${d} ở hàng ${HANG[p]}.`}},
    addsub(r,U){if(r()<.5){const a=U.ri(r,10000,60000),b=U.ri(r,1000,39999),c=a+b;return {q:`Tính: ${U.fmt(a)} + ${U.fmt(b)} = ___`,ans:String(c),x:`Đặt tính thẳng cột các chữ số cùng hàng rồi cộng từ phải sang trái: ${U.fmt(a)} + ${U.fmt(b)} = ${U.fmt(c)}.`}}
      const a=U.ri(r,20000,99999),b=U.ri(r,1000,a-1000),c=a-b;return {q:`Tính: ${U.fmt(a)} − ${U.fmt(b)} = ___`,ans:String(c),x:`Đặt tính thẳng cột rồi trừ từ phải sang trái (nhớ khi cần): ${U.fmt(a)} − ${U.fmt(b)} = ${U.fmt(c)}. Thử lại: ${U.fmt(c)} + ${U.fmt(b)} = ${U.fmt(a)}.`}},
    muldiv(r,U){const b=U.ri(r,2,9);if(r()<.5){const a=U.ri(r,1000,Math.floor(99999/b)),c=a*b;return {q:`Tính: ${U.fmt(a)} × ${b} = ___`,ans:String(c),x:`Nhân lần lượt từ phải sang trái: ${U.fmt(a)} × ${b} = ${U.fmt(c)}.`}}
      const q=U.ri(r,1000,Math.floor(99999/b)),a=q*b;return {q:`Tính: ${U.fmt(a)} : ${b} = ___`,ans:String(q),x:`Chia lần lượt từ trái sang phải: ${U.fmt(a)} : ${b} = ${U.fmt(q)}. Thử lại: ${U.fmt(q)} × ${b} = ${U.fmt(a)}.`}},
    evenodd(r,U){const want=U.pick(r,["chẵn","lẻ"]), mk=par=>{let n;do{n=U.ri(r,100,99999)}while(n%2!==par);return n};
      const wp=want==="chẵn"?0:1, c=mk(wp), o=new Set([c]);while(o.size<4)o.add(mk(1-wp));
      return {q:`Số nào dưới đây là số ${want}?`,o:[...o].map(U.fmt),x:`Số ${want} có chữ số tận cùng là ${want==="chẵn"?"0, 2, 4, 6, 8":"1, 3, 5, 7, 9"}. Số ${U.fmt(c)} có tận cùng là ${c%10}.`}},
    expr(r,U){const a=U.ri(r,2,9), t=U.ri(r,0,2);let e,v,s;
      if(t===0){const b=U.ri(r,100,500),c=U.ri(r,2,9);e=`${b} + a × ${c}`;s=`${b} + ${a} × ${c} = ${b} + ${a*c}`;v=b+a*c}
      else if(t===1){const b=U.ri(r,a+10,a+90),c=U.ri(r,2,9);e=`(${b} − a) × ${c}`;s=`(${b} − ${a}) × ${c} = ${b-a} × ${c}`;v=(b-a)*c}
      else{const b=U.ri(r,10,99),c=U.ri(r,10,b);e=`${b} × a − ${c}`;s=`${b} × ${a} − ${c} = ${b*a} − ${c}`;v=b*a-c}
      return {q:`Với a = ${a}, giá trị của biểu thức ${e} là: ___`,ans:String(v),x:`Thay a = ${a}: ${s} = ${U.fmt(v)}. Nhớ làm phép nhân, chia trước; trong ngoặc làm trước.`}},
    perim(r,U){if(r()<.5){const a=U.ri(r,5,40);return {q:`Hình vuông có cạnh a = ${a} cm. Chu vi P = a × 4 = ___ cm`,ans:String(a*4),x:`P = ${a} × 4 = ${a*4} (cm).`}}
      const a=U.ri(r,10,50),b=U.ri(r,3,a-1);return {q:`Hình chữ nhật có chiều dài a = ${a} cm, chiều rộng b = ${b} cm. Chu vi P = (a + b) × 2 = ___ cm`,ans:String((a+b)*2),x:`P = (${a} + ${b}) × 2 = ${a+b} × 2 = ${(a+b)*2} (cm).`}},
    step3(r,U){const t=U.ri(r,0,2);
      if(t===0){const y=U.ri(r,10,40)*5,k=U.ri(r,2,3),x=y*(1+k)+U.ri(r,10,100)*5,rem=x-y-k*y;
        return {q:`Một cửa hàng có ${U.fmt(x)} kg gạo. Buổi sáng bán được ${y} kg, buổi chiều bán được gấp ${k} lần buổi sáng. Hỏi cửa hàng còn lại bao nhiêu ki-lô-gam gạo? ___ kg`,ans:String(rem),x:`Buổi chiều bán: ${y} × ${k} = ${k*y} (kg). Cả hai buổi bán: ${y} + ${k*y} = ${y+k*y} (kg). Còn lại: ${U.fmt(x)} − ${y+k*y} = ${U.fmt(rem)} (kg).`}}
      if(t===1){const a=U.ri(r,28,35),d=U.ri(r,2,5),k=U.ri(r,3,6),b=a+d,tot=(a+b)*k;
        return {q:`Lớp 4A có ${a} bạn, lớp 4B có nhiều hơn lớp 4A ${d} bạn. Mỗi bạn được phát ${k} quyển vở. Hỏi cả hai lớp được phát bao nhiêu quyển vở? ___ quyển`,ans:String(tot),x:`Lớp 4B có: ${a} + ${d} = ${b} (bạn). Cả hai lớp: ${a} + ${b} = ${a+b} (bạn). Số vở: ${a+b} × ${k} = ${tot} (quyển).`}}
      const n=U.ri(r,2,5),p=U.ri(r,15,45)*1000,w=U.ri(r,5,15)*1000,tot=n*p+w,m=(Math.floor(tot/50000)+1)*50000;
      return {q:`Mẹ mua ${n} hộp bánh, mỗi hộp giá ${U.fmt(p)} đồng, và một chai nước giá ${U.fmt(w)} đồng. Mẹ đưa cô bán hàng ${U.fmt(m)} đồng. Cô bán hàng trả lại mẹ ___ đồng`,ans:String(m-tot),x:`Tiền bánh: ${U.fmt(p)} × ${n} = ${U.fmt(n*p)} (đồng). Tổng tiền: ${U.fmt(n*p)} + ${U.fmt(w)} = ${U.fmt(tot)} (đồng). Tiền trả lại: ${U.fmt(m)} − ${U.fmt(tot)} = ${U.fmt(m-tot)} (đồng).`}},

function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=hash(String(seed));return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffleWith(arr,r){arr=arr.slice();for(let i=arr.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function apportion(sizes,n){
  const total=Object.values(sizes).reduce((a,b)=>a+b,0), out={}, rem=[];let used=0;
  for(const [k,c] of Object.entries(sizes)){const x=n*c/total;out[k]=Math.floor(x);used+=out[k];rem.push([x-out[k],k])}
  rem.sort((a,b)=>b[0]-a[0]);for(let i=0;used<n&&rem.length;i++,used++)out[rem[i%rem.length][1]]++;
  return out;
}
const NB=" ";
function fmt(n){const neg=n<0, a=Math.abs(n), s=String(a);return (neg?"−":"")+(a>=10000?s.replace(/\B(?=(\d{3})+(?!\d))/g,NB):s)}
const DIG=["không","một","hai","ba","bốn","năm","sáu","bảy","tám","chín"];
function read3(n,full){
  const h=Math.floor(n/100), t=Math.floor(n/10)%10, u=n%10, w=[];
  if(full||h>0)w.push(DIG[h],"trăm");
  if(t===0){if(u>0){if(full||h>0)w.push("linh");w.push(DIG[u])}}
  else if(t===1){w.push("mười");if(u===5)w.push("lăm");else if(u>0)w.push(DIG[u])}
  else{w.push(DIG[t],"mươi");if(u===1)w.push("mốt");else if(u===5)w.push("lăm");else if(u>0)w.push(DIG[u])}
  return w.join(" ");
}
function docSo(n){
  if(n===0)return "không";
  const units=["","nghìn","triệu","tỉ"], g=[];let x=n;
  while(x>0){g.push(x%1000);x=Math.floor(x/1000)}
  const out=[];
  for(let i=g.length-1;i>=0;i--){if(g[i]===0)continue;out.push(read3(g[i],i!==g.length-1));if(units[i])out.push(units[i])}
  return out.join(" ");
}

    while(got<q&&guard++<G.length*3){const cyc=Math.floor(pos/G.length), it=G[perm(base+"|"+l+"|"+cyc,G.length)[pos%G.length]];if(!seen.has(it.id)){seen.add(it.id);picked.push(it);got++}pos++}

function renderWriting(sid,i){
  clearInterval(tick);S=null;topRight.innerHTML="";
  const s=SUBJ[sid], W=s.writing[i], ck=store.get("wchk_"+sid+i,[]), draft=store.get("wdraft_"+sid+i,"");
  view.innerHTML=`<div class="stack">
    <button class="back" id="backBtn">‹ ${esc(s.name)}</button>
    <div class="label">Luyện viết</div>
    <h2>${esc(W.title)}</h2>
    <section class="panel"><div class="label">Đề bài</div><div>${esc(W.prompt)}</div></section>
    <section class="panel"><details class="outline"><summary>Gợi ý dàn ý</summary><ol>${W.outline.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></details></section>
    <section class="panel"><div class="label">Bài viết của bạn</div>
      <textarea id="draft" aria-label="Bài viết" placeholder="Bạn viết bài vào đây. Bài được lưu tự động trên máy này.">${esc(draft)}</textarea>
      <div class="muted small" id="wc"></div></section>
    <section class="panel"><div class="label">Tự kiểm tra</div>${W.checklist.map((c,j)=>`<label class="check"><input type="checkbox" id="ck${j}" data-j="${j}" ${ck.includes(j)?"checked":""}><span>${esc(c)}</span></label>`).join("")}</section>
  </div>`;
  const ta=$("#draft"), wc=$("#wc");
  const count=()=>{const n=ta.value.trim()?ta.value.trim().split(/\s+/).length:0;wc.textContent=n+" chữ"};
  count();let t;ta.oninput=()=>{count();clearTimeout(t);t=setTimeout(()=>store.set("wdraft_"+sid+i,ta.value),400)};
  view.querySelectorAll(".check input").forEach(c=>c.onchange=()=>{const v=[...view.querySelectorAll(".check input")].filter(x=>x.checked).map(x=>+x.dataset.j);store.set("wchk_"+sid+i,v)});
  $("#backBtn").onclick=()=>renderHome();
  window.scrollTo(0,0);
}
$("#homeBtn").onclick=()=>{if(S){const b=$("#endBtn");if(b)b.click();return}renderHome()};
renderHome();
})()}

</script>

</body></html>
