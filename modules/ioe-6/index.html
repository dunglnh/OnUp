/* Layout: one narrow column app, one question per screen like a real exam room; sunflower used only for the main action */
:root{
  --bg:#f3f6fb; --surface:#ffffff; --line:#d9e1ef; --ink:#14213d; --muted:#5b6782;

  --ok:#167a3a; --ok-soft:#e2f4e8; --bad:#b23a0b; --bad-soft:#fde9df; --on-sea:#ffffff;

  --display:"Lora",Georgia,serif;
  --body:"Noto Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}

  --sea:#9db7ff; --sea-soft:#1f2c4f; --sun:#ffc933; --sun-soft:#3a3010; --sun-ink:#2b1f00;
  --ok:#4ade80; --ok-soft:#123323; --bad:#fb923c; --bad-soft:#3a1d10; --on-sea:#0d1424; --pick:#9db7ff; --pick-soft:#1f2c4f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1424; --surface:#16203a; --line:#2a3758; --ink:#e7edfa; --muted:#9aa8c7;
  --sea:#9db7ff; --sea-soft:#1f2c4f; --sun:#ffc933; --sun-soft:#3a3010; --sun-ink:#2b1f00;
  --ok:#4ade80; --ok-soft:#123323; --bad:#fb923c; --bad-soft:#3a1d10; --on-sea:#0d1424; --pick:#9db7ff; --pick-soft:#1f2c4f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.app{max-width:640px;margin:0 auto}
h1,h2,h3{line-height:1.35;margin:0;text-wrap:balance}
h2{font-size:1.35rem}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible,label.btn:focus-within{outline:3px solid var(--sun);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.brand{font-weight:800;font-size:1.25rem;color:var(--sea);display:flex;align-items:center;gap:8px;background:none;border:0;padding:7px 0;margin:-7px 0;min-height:44px}
.brand b{background:var(--sun);color:var(--sun-ink);border-radius:8px;padding:0 8px;font-size:1rem}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.warn{border-color:var(--bad);color:var(--bad);font-weight:700}
.stack{display:flex;flex-direction:column;gap:14px}
.hero{background:var(--sea);color:var(--on-sea);border-radius:20px;padding:22px 20px;display:flex;flex-direction:column;gap:10px}
.hero h1{font-size:1.75rem}
.hero p{margin:0;opacity:.9;max-width:60ch}
.label{font-size:.8125rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.hero .label{color:inherit;opacity:.8}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;background:var(--sea-soft);color:var(--sea)}
.btn.main{background:var(--sun);color:var(--sun-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.hero .btn.ghost{border-color:currentColor;color:inherit;opacity:.9}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.sec{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--sea-soft);border-radius:12px;padding:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px 8px;font-weight:700;color:var(--sea);line-height:1.2}
.seg button small{display:block;font-weight:500;font-size:.75rem;opacity:.85}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(20,33,61,.15)}
.weeks{display:flex;flex-direction:column;gap:12px}
.week{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.week.now{border:2px solid var(--sun)}
.wk-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.wk-h b{font-size:1.05rem}
.wk-h span{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.wk-h .tag{color:var(--sun-ink);font-size:.7rem}
.tag{background:var(--sun);color:var(--sun-ink);border-radius:6px;padding:0 6px;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.tests{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.tb{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 0;display:flex;flex-direction:column;align-items:center;line-height:1.15;font-variant-numeric:tabular-nums;min-width:0}
.tb b{font-size:.95rem}
.tb small{font-size:.68rem;color:var(--muted)}
.tb.good{background:var(--ok-soft);border-color:var(--ok)}
.tb.good small{color:var(--ok);font-weight:700}
.tb.fair{background:var(--sun-soft);border-color:var(--sun)}
.tb.fair small{color:var(--ink);font-weight:700}
.tb.next{border:2px solid var(--sea)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.unit{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.unit .n{font-weight:800;color:var(--sea);font-size:1.05rem}
.unit .t{font-size:.9rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.hist{display:flex;flex-direction:column}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:.9rem;font-variant-numeric:tabular-nums}
.hist div:first-child{border-top:0}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--sun);transition:width .3s}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px 18px;display:flex;flex-direction:column;gap:16px}
.qhead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.qtext{font-size:1.2rem;font-weight:600;min-width:0;overflow-wrap:anywhere}
.qtext u,.opt u{text-decoration-thickness:2px;text-underline-offset:3px;color:var(--sea);font-weight:700}
.qtext sub{font-size:.7rem;font-weight:800;color:var(--sea);margin-left:1px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.wide{grid-template-columns:1fr}
@media (max-width:420px){.opts{grid-template-columns:1fr}}
.opt{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:1.05rem;display:flex;gap:10px;align-items:baseline;min-width:0;overflow-wrap:anywhere}
.opt .k{font-weight:800;color:var(--muted)}
.opt.sel{border-color:var(--pick);background:var(--pick-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.blank{font:inherit;font-weight:700;border:0;border-bottom:3px solid var(--pick);background:var(--pick-soft);color:var(--ink);border-radius:6px 6px 0 0;padding:2px 6px;width:9em;max-width:100%;text-align:center}
.letter{width:1.4em;padding:2px 0;text-transform:lowercase;margin:0 1px}
.word{font-size:1.6rem;letter-spacing:.06em}
.slot{min-height:56px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.tile{border:1px solid var(--line);background:var(--sea-soft);color:var(--ink);border-radius:10px;padding:8px 12px;font-weight:600}
.tile.used{visibility:hidden}
.fb{border-radius:12px;padding:12px 14px;font-weight:600}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb span{color:var(--ink);font-weight:500}
.actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.score{font-family:var(--display);font-size:3.4rem;font-weight:800;color:var(--sea);line-height:1}
.ubreak{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:center;font-size:.9rem;font-variant-numeric:tabular-nums}
.review{display:flex;flex-direction:column;gap:10px}
.rv{border-left:4px solid var(--bad);padding:6px 0 6px 12px;display:flex;flex-direction:column;gap:2px;overflow-wrap:anywhere}
.rv .ans{font-size:.9rem}
.rv .ans b{color:var(--ok)}
.rv .ans s{color:var(--bad)}
textarea{width:100%;min-height:260px;font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);color:var(--ink)}
pre.fmt{margin:0;white-space:pre-wrap;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border-radius:10px;padding:10px 12px;overflow-x:auto}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9em;background:var(--bg);padding:1px 5px;border-radius:5px}
.confirm{border:2px solid var(--bad);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.listen{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--sea-soft);border-radius:14px;padding:10px 12px}
.play{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;background:var(--sea);color:var(--on-sea);padding:10px 18px;font-weight:700}
.play svg{width:14px;height:14px}
.play:disabled,.listen .btn:disabled{opacity:.5;cursor:default}
.listen .btn{padding:8px 14px}
.plays{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.opt.picopt{justify-content:center;align-items:center;font-size:2.4rem;line-height:1.1;padding:12px}
.opt.picopt .k{font-size:1rem}
.notice{background:var(--sun-soft);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:.9rem}
.heard{margin-top:8px;font-size:.9rem;color:var(--muted);font-weight:500}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* ================= Normalise ================= */
const PROMPT={o:"Choose the odd one out.",p:"Choose the word whose underlined part is pronounced differently.",s:"Choose the word with a different stress pattern."};
function toQ(row,lv,i){
  const [t,u]=row, id=lv+i, q={id,lv,t,u};
  if(t==="m"){q.q=row[2];q.o=row.slice(3);q.a=0}
  else if(t==="o"||t==="p"||t==="s"){q.q=PROMPT[t];q.o=row.slice(2);q.a=0}
  else if(t==="e"){q.s=row[2];q.a=row[3];q.fix=row[4];q.parts=[...row[2].matchAll(/\[([^\]]+)\]/g)].map(m=>m[1])}
  else if(t==="f"){q.q=row[2];q.ans=row[3].split("|")}
  else if(t==="l"){q.w=row[2];q.h=row[3]}
  else if(t==="r"){q.s=row[2]}
  else if(t==="h"){q.say=row[2];q.q=row[3]||"Listen and choose the right answer.";q.o=row.slice(4);q.a=0}
  else if(t==="hp"){q.say=row[2];q.q="Listen and choose the right picture.";q.o=row.slice(3);q.a=0;q.pics=true}
  else if(t==="hf"){q.say=row[2];q.q=row[3];q.ans=row[4].split("|")}
  return q;
}
const BANKS={W:WARD.concat(WARD_L).map((r,i)=>toQ(r,"W",i)),C:CITY.concat(CITY_L).map((r,i)=>toQ(r,"C",i))};

/* ================= Test plan =================
   Every test is fixed: the same test number always gives the same questions.
   Questions rotate type by type through a fresh shuffle each cycle, so a question
   only comes back after the rest of its type has been used.                         */
const DAY=864e5;
const TRACKS={
  W:{key:"W",name:"Ward Level",units:"Units 1–6",start:new Date(2026,9,12),weeks:13,exam:new Date(2027,0,7),examText:"7–9 Jan 2027",pools:[["W",30]],mins:20},
  C:{key:"C",name:"City Level",units:"Units 1–9",start:new Date(2027,0,11),weeks:8,exam:new Date(2027,2,4),examText:"4–6 Mar 2027",pools:[["C",24],["W",6]],mins:20}
};

function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=hash(String(seed));return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffleWith(arr,r){arr=arr.slice();for(let i=arr.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
const rand=()=>Math.random;
function apportion(sizes,n){
  const total=Object.values(sizes).reduce((a,b)=>a+b,0), out={}, rem=[];let used=0;
  for(const [k,c] of Object.entries(sizes)){const x=n*c/total;out[k]=Math.floor(x);used+=out[k];rem.push([x-out[k],k])}
  rem.sort((a,b)=>b[0]-a[0]);for(let i=0;used<n;i++,used++)out[rem[i%rem.length][1]]++;
  return out;
}
const groupCache={};
function groups(bank,noListen){
  const ck=bank+(noListen?"-r":"");
  if(groupCache[ck])return groupCache[ck];
  const g={};BANKS[bank].forEach(q=>{const t=q.say?"L":q.t;if(noListen&&t==="L")return;(g[t]=g[t]||[]).push(q)});
  return groupCache[ck]=g;
}
const permCache={};
function perm(track,bank,t,cycle,len){
  const k=[track,bank,t,cycle].join(":");
  return permCache[k]||(permCache[k]=shuffleWith([...Array(len).keys()],rng(k)));
}
function buildTest(trackKey,k,noListen){
  const T=TRACKS[trackKey], picked=[], seen=new Set();
  for(const [bank,n] of T.pools){
    const g=groups(bank,noListen), sizes={};for(const t in g)sizes[t]=g[t].length;
    const quota=apportion(sizes,n);
    for(const t in quota){
      const G=g[t], q=Math.min(quota[t],G.length);let pos=k*quota[t], got=0, guard=0;
      while(got<q&&guard++<G.length*3){
        const cyc=Math.floor(pos/G.length), item=G[perm(trackKey,bank,t,cyc,G.length)[pos%G.length]];
        if(!seen.has(item.id)){seen.add(item.id);picked.push(item);got++}
        pos++;
      }
    }
  }
  const order=shuffleWith(picked,rng(trackKey+"-order-"+k));
  return order.map(q=>inst(q,trackKey+"-"+k+"-"+q.id));
}

/* Make a playable copy: shuffled options, shuffled tiles, chosen missing letters */
function inst(q,seed){
  const r=seed==null?rand():rng(seed), x={...q};
  if(x.o){x.order=shuffleWith(x.o.map((_,i)=>i),r)}
  if(x.t==="r"){const c=chunks(x.s).map((c,i)=>({c,i}));let s=c;for(let n=0;n<6;n++){s=shuffleWith(c,r);if(s.some((t,i)=>t.i!==i))break}x.tiles=s}
  if(x.t==="l"){
    const idx=[...x.w].map((ch,i)=>/[a-z]/i.test(ch)?i:-1).filter(i=>i>=0);
    const n=x.lv==="C"&&x.w.length>=7?2:1;
    x.miss=shuffleWith(idx,r).slice(0,n).sort((a,b)=>a-b);
  }
  return x;
}

TTS.ready=new Promise(res=>{
  const fin=ok=>{if(TTS.done)return;TTS.done=true;TTS.ok=ok;res(ok);drawSound()};
  if(!TTS.api){setTimeout(()=>fin(false),0);return}
  const pick=()=>{let vs=[];try{vs=speechSynthesis.getVoices()||[]}catch(e){}
    const en=vs.filter(v=>/^en([-_]|$)/i.test(v.lang));
    if(!en.length)return false;
    for(const re of [/^en[-_]GB/i,/^en[-_]US/i,/^en/i]){const v=en.find(v=>re.test(v.lang)&&v.localService)||en.find(v=>re.test(v.lang));if(v){TTS.voice=v;break}}
    return true};
  if(pick()){setTimeout(()=>fin(true),0);return}
  try{speechSynthesis.addEventListener("voiceschanged",()=>{if(pick())fin(true)})}catch(e){}
  setTimeout(()=>fin(pick()),2000);
});
const canListen=()=>TTS.ok&&!TTS.off;
function speak(text,rate,cb){
  let ended=false;const end=err=>{if(ended)return;ended=true;cb(err)};
  try{
    if(speechSynthesis.speaking||speechSynthesis.pending)speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    if(TTS.voice){u.voice=TTS.voice;u.lang=TTS.voice.lang}else u.lang="en-US";
    u.rate=rate;
    u.onend=()=>end(null);
    u.onerror=e=>{const c=(e&&e.error)||"error";end(/interrupted|canceled/.test(c)?null:c)};
    speechSynthesis.speak(u);
    setTimeout(()=>end(null),Math.max(4000,text.length*140/rate+2000));
  }catch(e){end("error")}
}
function stopSpeech(){try{if(TTS.api&&(speechSynthesis.speaking||speechSynthesis.pending))speechSynthesis.cancel()}catch(e){}}
function wireListen(q){
  S.playsLeft=3;S.speaking=false;
  const play=$("#playBtn"), slow=$("#slowBtn"), info=$("#plays");
  const upd=()=>{if(!S||S.qs[S.i]!==q)return;
    const out=!S.checked&&S.playsLeft<=0;
    play.disabled=slow.disabled=S.speaking||out;
    play.querySelector("span").textContent=S.speaking?"Playing…":"Play";
    info.textContent=S.checked?"Listen again as many times as you like.":out?"No plays left.":`${S.playsLeft} of 3 plays left`};
  const go=rate=>{if(S.speaking)return;if(!S.checked){if(S.playsLeft<=0)return;S.playsLeft--}
    S.speaking=true;upd();
    speak(q.say,rate,err=>{if(!S||S.qs[S.i]!==q)return;S.speaking=false;upd();if(err)soundFailed()})};
  play.onclick=()=>go(.9);slow.onclick=()=>go(.6);
  S.updPlay=upd;upd();
}
function soundFailed(){
  TTS.off=true;store.set("listenOff",true);
  if(!S)return;
  if(S.mode==="exam"){
    const used=new Set(S.qs.map(x=>x.id));
    const pool=TRACKS[S.test.tk].pools.flatMap(([b])=>BANKS[b]).filter(x=>!x.say&&!used.has(x.id));
    for(let i=S.i;i<S.qs.length;i++)if(S.qs[i].say&&pool.length){const nq=pool.splice(Math.floor(Math.random()*pool.length),1)[0];S.qs[i]=inst(nq)}
  }else{
    S.qs=S.qs.filter((x,i)=>i<S.i||!x.say);
    if(S.i>=S.qs.length){finish();return}
  }
  S.notice="Sound didn't play on this device, so the listening questions have been replaced with reading questions.";
  renderQ();
}
function drawSound(){
  const p=document.getElementById("soundPanel");if(!p)return;
  let html;
  if(!TTS.done)html=`<div class="muted">Checking the English voice on this device…</div>`;
  else if(!TTS.ok)html=`<div>This device can't read English aloud, so tests use reading questions in place of listening questions. Try another browser or device for listening practice.</div>`;
  else if(TTS.off)html=`<div>Listening is turned off on this device. Tests use reading questions instead.</div><div class="row"><button class="btn" id="sndOn">Turn listening on</button></div>`;
  else html=`<div>Each test has about 4 listening questions. You can play each one 3 times, at normal or slow speed. Turn the volume up, then check the sound.</div><div class="row"><button class="btn" id="sndTest">Test sound</button></div><div id="sndAsk"></div>`;
  p.innerHTML=html;
  const on=document.getElementById("sndOn");if(on)on.onclick=()=>{TTS.off=false;store.set("listenOff",false);drawSound()};
  const t=document.getElementById("sndTest");
  if(t)t.onclick=()=>{
    t.disabled=true;
    speak("Hello! Can you hear me? Let's practise English.",.9,err=>{

    });
  };
}

const $=s=>document.querySelector(s);

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const safe=s=>esc(s).replace(/&lt;(\/?)u&gt;/g,"<$1u>");
const norm=s=>String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g," ").replace(/[.!?]+$/,"").trim();
const chunks=s=>s.split("/").map(x=>x.trim()).filter(Boolean);
const fmtTime=s=>{s=Math.max(0,Math.round(s));return String(s/60|0).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
const fmtDate=d=>d.toLocaleDateString("en-GB",{day:"numeric",month:"short"});

function today(){const d=new Date();d.setHours(0,0,0,0);return d}
function correctText(q){
  if(q.o)return strip(q.o[q.a]);
  if(q.ans)return q.ans.join(" / ");
  if(q.t==="l")return q.w;
  if(q.t==="e")return `${LETTERS[q.a]} (${q.parts[q.a]}) → ${q.fix}`;
  return chunks(q.s).join(" ");
}
function stemText(q){
  if(q.say)return "Listening: “"+esc(q.say)+"”"+(q.t==="h"?" · "+esc(q.q):"");
  if(q.t==="r")return "Reorder: "+esc(chunks(q.s).join(" / "));
  if(q.t==="l")return "Missing letters: "+esc(q.w.split("").map((c,i)=>q.miss&&q.miss.includes(i)?"_":c).join(""))+" ("+esc(q.h)+")";
  if(q.t==="e")return "Find the mistake: "+esc(q.s.replace(/\[|\]/g,""));
  if(q.t==="f")return safe(q.q);
  if(q.t==="o"||q.t==="p"||q.t==="s")return esc(q.q)+" "+q.o.map(safe).join(", ");
  return safe(q.q);
}

  for(let k=w*PER_WEEK;k<(w+1)*PER_WEEK;k++)if(!results[resKey(tk,k)])return k;

    body=`<div class="label">Fill in the blank</div><div class="qtext">${parts[0]}<input class="blank" id="fillIn" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Your answer">${parts.slice(1).join("___")}</div>`;
  }else if(q.t==="l"){
    let m=0;const w=[...q.w].map((c,i)=>q.miss.includes(i)?`<input class="blank letter" data-m="${m++}" maxlength="1" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Missing letter">`:esc(c)).join("");
    body=`<div class="label">Fill in the missing letter${q.miss.length>1?"s":""}</div><div class="qtext word">${w}</div><div class="muted small">Clue: ${esc(q.h)}</div>`;
  }else{
    body=`<div class="label">Put the words in the correct order</div><div class="slot" id="slot" aria-label="Your sentence"></div><div class="pool" id="pool">${q.tiles.map((t,k)=>`<button class="tile" data-k="${k}">${esc(t.c)}</button>`).join("")}</div>`;
  }
  view.innerHTML=`<div class="stack">
    <div class="bar" aria-hidden="true"><i style="width:${S.i/n*100}%"></i></div>
    ${S.notice?`<div class="notice" role="status">${esc(S.notice)}</div>`:""}
    <section class="qcard">
      <div class="qhead"><span class="label">${esc(S.label)}</span><span class="label">${q.u?("Unit "+q.u):"My Questions"}</span></div>
      ${body}
      <div id="fb" aria-live="polite"></div>
    </section>
    <div class="actions"><button class="btn ghost" id="skipBtn">Skip</button><button class="btn main" id="goBtn">${exam?"Submit answer":"Check"}</button></div>
    <div id="endArea"></div>
  </div>`;
  drawEnd();wireQ(q);S.notice=null;
}
function drawEnd(){
  const exam=S.mode==="exam";
  $("#endArea").innerHTML=`<button class="btn ghost small" id="endBtn">${exam?"Finish test now":"End practice"}</button>`;
  $("#endBtn").onclick=()=>{
    $("#endArea").innerHTML=`<div class="confirm"><div>${exam?"Finish the test now? Unanswered questions will count as wrong.":"End practice and see your results?"}</div><div class="row"><button class="btn danger" id="yesEnd">${exam?"Finish test":"End practice"}</button><button class="btn ghost" id="noEnd">Keep going</button></div></div>`;
    $("#yesEnd").onclick=finish;$("#noEnd").onclick=drawEnd;
  };
}
function wireQ(q){
  if(q.say)wireListen(q);
  const pickable=q.o||q.t==="e";
  if(pickable)view.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(S.checked)return;view.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");S.cur=+b.dataset.o});
  if(q.t==="f"||q.t==="hf"){const inp=$("#fillIn");inp.oninput=()=>S.cur=inp.value;inp.onkeydown=e=>{if(e.key==="Enter")$("#goBtn").click()};setTimeout(()=>inp.focus({preventScroll:true}),50)}
  if(q.t==="l"){
    const ins=[...view.querySelectorAll("input.letter")];
    ins.forEach((inp,j)=>{inp.oninput=()=>{S.cur[j]=inp.value;if(inp.value&&ins[j+1])ins[j+1].focus()};inp.onkeydown=e=>{if(e.key==="Enter")$("#goBtn").click();if(e.key==="Backspace"&&!inp.value&&ins[j-1])ins[j-1].focus()}});
    setTimeout(()=>ins[0].focus({preventScroll:true}),50);
  }
  if(q.t==="r"){
    const draw=()=>{const slot=$("#slot");slot.innerHTML=S.cur.length?S.cur.map((k,pos)=>`<button class="tile" data-p="${pos}">${esc(q.tiles[k].c)}</button>`).join(""):`<span class="muted small">Tap the words below to build the sentence.</span>`;
      view.querySelectorAll("#pool .tile").forEach(t=>t.classList.toggle("used",S.cur.includes(+t.dataset.k)));
      slot.querySelectorAll(".tile").forEach(t=>t.onclick=()=>{if(S.checked)return;S.cur.splice(+t.dataset.p,1);draw()})};
    view.querySelectorAll("#pool .tile").forEach(t=>t.onclick=()=>{if(S.checked)return;const k=+t.dataset.k;if(!S.cur.includes(k)){S.cur.push(k);draw()}});
    draw();
  }
  $("#skipBtn").onclick=()=>{record(q,null);next()};
  $("#goBtn").onclick=()=>{
    if(S.checked){next();return}
    const empty=S.cur==null||S.cur===""||(Array.isArray(S.cur)&&(!S.cur.length||S.cur.some(x=>x==="")));
    if(empty){$("#fb").innerHTML=`<div class="fb bad">Answer the question first, or tap Skip.</div>`;return}
    const ok=record(q,S.cur);
    if(S.mode==="exam"){next();return}
    S.checked=true;showFeedback(q,ok);if(q.say){$("#fb").insertAdjacentHTML("beforeend",`<div class="heard">You heard: “${esc(q.say)}”</div>`);S.updPlay&&S.updPlay()}$("#goBtn").textContent=S.i+1<S.qs.length?"Next question":"See results";$("#skipBtn").disabled=true;
  };
}
function isRight(q,given){
  if(given==null)return false;
  if(q.o||q.t==="e")return given===q.a;
  if(q.ans)return q.ans.some(a=>norm(a)===norm(given));
  if(q.t==="l")return q.miss.every((p,j)=>norm(given[j])===q.w[p].toLowerCase());
  return given.map(k=>q.tiles[k].c).join(" ")===chunks(q.s).join(" ");
}
function givenText(q,given){
  if(given==null)return "(no answer)";
  if(q.o)return strip(q.o[given]);
  if(q.t==="e")return `${LETTERS[given]} (${q.parts[given]})`;
  if(q.t==="r")return given.map(k=>q.tiles[k].c).join(" ");
  if(q.t==="l"){let j=0;return [...q.w].map((c,i)=>q.miss.includes(i)?(given[j++]||"_"):c).join("")}
  return String(given);
}
function record(q,given){
  const ok=isRight(q,given);
  S.ans[S.i]={q,given,ok};
  if(ok)wrongIds.delete(q.id);else wrongIds.add(q.id); // L27: a correct answer in any mode (tests too) removes the question from the review list
  saveWrong();return ok;
}
function showFeedback(q,ok){
  if(q.o||q.t==="e")view.querySelectorAll(".opt").forEach(b=>{const o=+b.dataset.o;if(o===q.a)b.classList.add("right");else if(b.classList.contains("sel"))b.classList.add("wrong")});
  $("#fb").innerHTML=ok?`<div class="fb ok">Correct!</div>`:`<div class="fb bad">Not quite. <span>Answer: <b>${esc(correctText(q))}</b></span></div>`;
}
function next(){S.i++;if(S.i>=S.qs.length)finish();else renderQ()}

function finish(){
  if(!S)return;
  stopSpeech();
  clearInterval(tick);
  const secs=Math.min((Date.now()-S.start)/1000,S.limit||Infinity);
  if(S.mode==="exam")for(let i=0;i<S.qs.length;i++)if(!S.ans[i]){S.ans[i]={q:S.qs[i],given:null,ok:false};wrongIds.add(S.qs[i].id)}
  saveWrong();
  const done=S.ans.filter(Boolean), right=done.filter(a=>a.ok).length, total=done.length;
  if(S.test){const key=resKey(S.test.tk,S.test.k), prev=results[key];results[key]={b:Math.max(right,prev?prev.b:0),l:right,t:total};store.set("res",results)}
  history.unshift({d:new Date().toISOString(),l:S.label,r:right,t:total,s:Math.round(secs)});
  history=history.slice(0,20);store.set("hist",history);
  window.ontapReport&&ontapReport({label:S.label,mode:S.mode,subject:"ta",r:right,t:total,s:Math.round(secs)});
  const pct=total?Math.round(right/total*100):0;
  const msg=pct>=90?"Excellent! You are ready for the exam.":pct>=75?"Great work! Review your mistakes to do even better.":pct>=50?"Good effort. Practise the units below, then try another test.":"Keep going! Practise one unit at a time, then try again.";
  const units={};done.forEach(a=>{const k=a.q.u?a.q.u:0;units[k]=units[k]||[0,0];units[k][1]++;if(a.ok)units[k][0]++});
  const wrong=done.filter(a=>!a.ok), test=S.test;
  topRight.innerHTML="";
  view.innerHTML=`<div class="stack">
    <section class="panel">
      <div class="label">${esc(S.label)}${test?" · Week "+(Math.floor(test.k/PER_WEEK)+1):""}</div>
      <div class="row" style="gap:18px;align-items:flex-end"><div class="score">${right}<span style="font-size:1.6rem;color:var(--muted)">/${total}</span></div>
      <div class="stack" style="gap:2px"><b>${pct}% correct</b><span class="muted small">Time: ${fmtTime(secs)}</span></div></div>
      <div>${msg}</div>
    </section>
    ${total?`<section class="panel"><div class="label">By unit</div><div class="ubreak">${Object.keys(units).sort((a,b)=>a-b).map(k=>{const [r,t]=units[k];return `<span>${+k?"Unit "+k:"My Questions"}</span><div class="bar"><i style="width:${r/t*100}%"></i></div><span>${r}/${t}</span>`}).join("")}</div></section>`:""}
    ${wrong.length?`<section class="panel"><div class="label">Questions to review (${wrong.length})</div><div class="review">${wrong.map(a=>`<div class="rv"><div>${stemText(a.q)}</div><div class="ans">Your answer: <s>${esc(givenText(a.q,a.given))}</s> · Correct: <b>${esc(correctText(a.q))}</b></div></div>`).join("")}</div></section>`:""}
    ${!wrong.length&&total&&wrongIds.size?`<p class="muted small" id="wrongNote" style="margin:0">No mistakes this time. Your review list still has ${wrongIds.size} question${wrongIds.size>1?"s":""} from earlier.</p>`:""}
    <div class="row" id="resBtns"></div>
  </div>`;
  const btns=$("#resBtns");
  if(test){const nk=nextTest(test.tk);if(nk!=null){const b=document.createElement("button");b.className="btn main";b.textContent=`Start Test ${nk+1}`;b.onclick=()=>startTest(test.tk,nk);btns.append(b)}}
  if(wrongIds.size){const b=document.createElement("button");b.className="btn";b.textContent=`Review mistakes (${wrongIds.size})`;b.onclick=startWrong;btns.append(b)}
  const h=document.createElement("button");h.className="btn ghost";h.textContent="Home";h.onclick=()=>renderHome();btns.append(h);
  S=null;window.scrollTo(0,0);
}
function startWrong(){startPractice([...wrongIds].map(byId).filter(Boolean),"Mistake Review")}

/* ================= Home ================= */
let tab=store.get("tab",defaultTrack());
function renderHome(note){
  clearInterval(tick);S=null;topRight.innerHTML="";
  const tk=defaultTrack(), T=TRACKS[tk], nk=nextTest(tk);
  const days=Math.ceil((T.exam-today())/DAY);
  const wk=nk!=null?Math.floor(nk/PER_WEEK)+1:null;
  view.innerHTML=`<div class="stack">
    ${note?`<div class="fb bad">${esc(note)}</div>`:""}
    <section class="hero">
      <span class="label">Up next · ${T.name} · ${T.units}</span>
      <h1>${nk!=null?`Week ${wk} · Test ${nk+1}`:"All tests done!"}</h1>
      <p>${TEST_LEN} questions, including about 4 listening questions · ${T.mins} minutes. Answers appear after you finish, just like the real exam.</p>
      <p class="small">${T.name} exam: ${T.examText}${days>0?` · ${days} days to go`:""}</p>
      <div class="row">${nk!=null?`<button class="btn main" id="heroBtn">Start Test ${nk+1}</button>`:""}${wrongIds.size?`<button class="btn ghost" id="heroWrong">Review mistakes (${wrongIds.size})</button>`:""}</div>
    </section>

    <section class="sec">
      <h2>Test Plan</h2>
      <p class="muted small" style="margin:0">7 tests a week. Each test mixes every question type from the units. A question comes back only after the rest of the bank has been used, so the tests stay fresh and the hard words get repeated.</p>
      <div class="seg" role="group" aria-label="Choose level">
        ${["W","C"].map(k=>`<button data-tab="${k}" aria-pressed="${tab===k}">${TRACKS[k].name}<small>${TRACKS[k].units} · ${TRACKS[k].weeks*PER_WEEK} tests</small></button>`).join("")}
      </div>
      <div class="legend"><span><i style="background:var(--ok)"></i>80% or more</span><span><i style="background:var(--sun)"></i>Below 80%</span><span><i style="background:var(--line)"></i>Not done yet</span></div>
      <div class="weeks" id="weeks"></div>
    </section>

    <section class="sec"><h2>Listening</h2><div class="panel" id="soundPanel"></div></section>

    <section class="sec"><h2>Practise by Unit</h2><p class="muted small" style="margin:0">No timer. You see the answer after each question.</p>
      <div class="units">${Object.entries(UNITS).map(([u,t])=>{const n=allQ().filter(q=>q.u==u).length;return `<button class="unit" data-u="${u}"><span class="n">Unit ${u}</span><span class="t">${t}</span><span class="small muted">${n} questions${u>6?" · City Level":""}</span></button>`}).join("")}</div>
    </section>

    <section class="sec"><h2>Review Mistakes</h2>
      <div class="panel"><div>${wrongIds.size?`You have <b>${wrongIds.size}</b> questions to review. Answer one correctly in any practice or test and it leaves the list.`:"No mistakes saved yet. Do a test to get started."}</div>
      ${wrongIds.size?`<div class="row"><button class="btn" id="wrongBtn">Review ${wrongIds.size} questions</button></div>`:""}</div>
    </section>

    <section class="sec"><h2>My Questions</h2>
      <div class="panel">
        <div>${custom.length?`You have added <b>${custom.length}</b> questions.`:"Paste questions from a worksheet or practice book to practise them here."}</div>
        <div class="row"><button class="btn" id="impBtn">Add questions</button>${custom.length?`<button class="btn main" id="custBtn">Practise my questions</button><button class="btn danger" id="clrBtn">Delete all</button>`:""}</div>
        <div id="clrArea"></div>
      </div>
    </section>

    <section class="sec"><h2>History</h2>
      <div class="panel">${history.length?`<div class="hist">${history.map(h=>`<div><span>${fmtDate(new Date(h.d))} · ${esc(h.l)}</span><b>${h.r}/${h.t} · ${fmtTime(h.s)}</b></div>`).join("")}</div>`:`<span class="muted">Your results will appear here. They are saved on this device.</span>`}</div>
    </section>
    <p class="muted small" style="margin:0">Practice questions written for the Global Success English 6 course. This is a personal practice page, not the official IOE website.</p>
  </div>`;
  if($("#heroBtn"))$("#heroBtn").onclick=()=>startTest(tk,nk);
  if($("#heroWrong"))$("#heroWrong").onclick=startWrong;
  view.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;store.set("tab",tab);view.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed",x===b));drawWeeks()});
  drawWeeks();drawSound();
  view.querySelectorAll(".unit").forEach(b=>b.onclick=()=>startPractice(allQ().filter(q=>q.u==b.dataset.u),"Unit "+b.dataset.u+" Practice"));
  if($("#wrongBtn"))$("#wrongBtn").onclick=startWrong;
  $("#impBtn").onclick=renderImport;
  if($("#custBtn"))$("#custBtn").onclick=()=>startPractice(custom,"My Questions");
  if($("#clrBtn"))$("#clrBtn").onclick=()=>{$("#clrArea").innerHTML=`<div class="confirm"><div>Delete all ${custom.length} questions you added?</div><div class="row"><button class="btn danger" id="clrYes">Delete</button><button class="btn ghost" id="clrNo">Cancel</button></div></div>`;
    $("#clrYes").onclick=()=>{custom.forEach(q=>wrongIds.delete(q.id));saveWrong();custom=[];store.set("custom",custom);renderHome()};
    $("#clrNo").onclick=()=>$("#clrArea").innerHTML=""};
  window.scrollTo(0,0);
}
function drawWeeks(){
  const T=TRACKS[tab], cur=weekIndex(T), nk=nextTest(tab);
  $("#weeks").innerHTML=[...Array(T.weeks).keys()].map(w=>{
    const s=new Date(T.start.getTime()+w*7*DAY), e=new Date(s.getTime()+6*DAY);
    const isLast=w===T.weeks-1;
    return `<div class="week${w===cur?" now":""}" id="${tab}w${w}">
      <div class="wk-h"><b>Week ${w+1}</b><span>${fmtDate(s)} – ${fmtDate(e)}${isLast?" · exam week":""}</span>${w===cur?`<span class="tag">This week</span>`:""}</div>
      <div class="tests">${[...Array(PER_WEEK).keys()].map(d=>{const k=w*PER_WEEK+d, r=results[resKey(tab,k)];
        const cls=r?(r.b/r.t>=.8?"good":"fair"):"";
        return `<button class="tb ${cls}${k===nk?" next":""}" data-k="${k}" aria-label="Test ${k+1}${r?", best score "+r.b+" out of "+r.t:""}"><b>${k+1}</b><small>${r?r.b+"/"+r.t:"–"}</small></button>`}).join("")}</div>
    </div>`}).join("");
  $("#weeks").querySelectorAll(".tb").forEach(b=>b.onclick=()=>startTest(tab,+b.dataset.k));
}

/* ================= Import ================= */
const SAMPLE=`# Unit 1
My sister ___ to school by bike.
- go
* goes
- going
- is go

I'm interested [in] Science.

>> She / often / reads / books / in the library.

# Unit 2
Choose the odd one out.
* sofa
- kitchen
- bedroom
- bathroom`;
function parse(text){
  const out=[], errs=[];let unit=null;
  text.replace(/\r/g,"").split(/\n\s*\n/).forEach((blk,bi)=>{
    let lines=blk.split("\n").map(l=>l.trim()).filter(Boolean);
    while(lines.length&&lines[0].startsWith("#")){const m=lines[0].match(/(\d+)/);unit=m?+m[1]:null;lines.shift()}
    if(!lines.length)return;
    const u=unit&&unit>=1&&unit<=12?unit:null;
    if(lines[0].startsWith(">>")){const s=lines[0].slice(2).trim();if(chunks(s).length<2){errs.push(`Block ${bi+1}: a reorder question needs at least 2 parts separated by /`);return}out.push({u,t:"r",s});return}
    const opts=lines.filter(l=>/^[*-]\s*/.test(l));
    if(opts.length){
      const q=lines.filter(l=>!/^[*-]\s*/.test(l)).join(" ");
      const o=opts.map(l=>l.replace(/^[*-]\s*/,"")), a=opts.findIndex(l=>l.startsWith("*"));
      if(a<0){errs.push(`Block ${bi+1}: mark the correct answer with *`);return}
      if(o.length<2){errs.push(`Block ${bi+1}: add at least 2 answer choices`);return}
      out.push({u,t:"m",q:q||"Choose the best answer.",o,a});return}
    const line=lines.join(" "), m=line.match(/\[([^\]]+)\]/);
    if(m){out.push({u,t:"f",q:line.replace(m[0],"___"),ans:m[1].split("|").map(s=>s.trim()).filter(Boolean)});return}
    errs.push(`Block ${bi+1}: question type not recognised ("${lines[0].slice(0,40)}…")`);
  });
  return {out,errs};
}
function renderImport(){
  topRight.innerHTML="";
  view.innerHTML=`<div class="stack">
    <h2>Add Questions</h2>
    <div class="panel small">
      <div>Leave one empty line between questions. A line like <code># Unit 3</code> labels the questions under it.</div>
      <pre class="fmt">Multiple choice   * correct answer, - wrong answer
Fill in the blank  I'm good [at] Maths.   (more answers: [at|in])
Reorder            >> She / is / my best friend.</pre>
    </div>
    <textarea id="src" placeholder="Paste your questions here…" spellcheck="false" aria-label="Questions"></textarea>
    <div class="row"><button class="btn ghost" id="sampleBtn">Show an example</button><label class="btn ghost" for="fileIn">Open a .txt file</label><input type="file" id="fileIn" accept=".txt,text/plain" hidden></div>
    <div class="row"><button class="btn main" id="parseBtn">Check questions</button><button class="btn ghost" id="cancelBtn">Back</button></div>
    <div id="result"></div>
  </div>`;
  $("#sampleBtn").onclick=()=>$("#src").value=SAMPLE;
  $("#fileIn").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>$("#src").value=r.result;r.readAsText(f,"utf-8")};
  $("#cancelBtn").onclick=()=>renderHome();
  $("#parseBtn").onclick=()=>{
    const {out,errs}=parse($("#src").value);
    const c=t=>out.filter(q=>q.t===t).length;
    $("#result").innerHTML=`<div class="panel">
      <div>Found <b>${out.length}</b> questions: ${c("m")} multiple choice, ${c("f")} fill in the blank, ${c("r")} reorder.</div>
      ${errs.length?`<div class="fb bad small">${errs.map(esc).join("<br>")}</div>`:""}
      ${out.length?`<div class="row"><button class="btn main" id="saveBtn">Save ${out.length} questions</button></div>`:""}
    </div>`;
    if($("#saveBtn"))$("#saveBtn").onclick=()=>{const base=Date.now().toString(36);out.forEach((q,i)=>q.id="M"+base+i);custom=custom.concat(out);store.set("custom",custom);renderHome()};
  };
}

$("#homeBtn").onclick=()=>{if(S){$("#endBtn")&&$("#endBtn").click();return}renderHome()};
renderHome();
</script>
